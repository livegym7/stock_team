# 계좌·리스크 규칙 (사용자 확정 2026-11-02). 주문 기능은 없음 — 수량 계산과 알림에만 쓴다.
capital = 15000000          # 투자 가능 금액 (원)
risk_per_trade = 0.02       # 1회 매매 최대 손실 = 계좌의 2% (= 30만 원)
intraday = true             # 장중 알림 보고 대응 가능
fundamental_gate = "score"  # 펀더멘털은 관문으로 거르지 않고 점수로만 표시
stop_pct = 0.08             # 손절 = 매수가(또는 기준가) -8% = 1R, 사용자 확정 2026-11-02

breakeven_at_r = 3          # 3R에 닿으면 손절가를 본전(평균가)으로 올림 → 그 종목 CR 0, 사용자 확정 2026-11-03
# take_profit_at_3r = 0.5   # 3R에서 일부 익절 비율 — 미정 (책 기준 50%). 정하면 주석을 풀고 숫자 입력
cr_basis = "entry"          # CR(현재 위험)은 매수가 기준: Σ max(0, 평균가 - 지금 손절가) × 수량

max_open_risk = 0.06        # CR 한도: 모든 종목이 동시에 손절돼도 최대 손실 = 계좌의 6%(3R, 90만 원), 사용자 확정 2026-11-03

# 아래는 Claude 제안 기본값 (사용자 확인 전)
red_light_risk = 0.01       # 신호등 🔴(하락 추세)일 때는 1회 위험을 1%로 낮춤
