# 계좌·리스크 규칙 (사용자 확정 2026-11-02). 주문 기능은 없음 — 수량 계산과 알림에만 쓴다.
capital = 15000000          # 시작 계좌 금액 (원). 2026-11-18 사용자 확정: 이 금액에서 시작해 이후 거래의 실현 손익(비용 뺀 것)만큼 늘고 줄어듦
capital_start_at = "2026-11-18T11:05:02+09:00"   # 이 시각 이후 매수·매도부터 계좌에 반영 (그 전 거래는 반영 안 함)
addon_capital = 3000000      # 부록 · 지수 되돌림 전용 계좌 (2026-11-18 사용자 확정): 본 계좌와 따로, 부록 거래 손익만큼 늘고 줄어듦
addon_start_at = "2026-11-18T14:45:57+09:00"
cost_rate = 0.0023          # 세금+수수료: 사고 파는 한 번(왕복)에 0.23% → 매도할 때 매도 금액의 0.23%를 뺌 (2026-11-18 사용자 확정)
risk_per_trade = 0.02       # 1회 매매 최대 손실 = 계좌의 2% (= 30만 원)
intraday = true             # 장중 알림 보고 대응 가능 (설명용 — 코드는 이 값을 읽지 않음)
fundamental_gate = "score"  # 펀더멘털은 관문으로 거르지 않고 점수로만 표시 (설명용 — 코드는 이 값을 읽지 않음)
stop_pct = 0.08             # 손절 = 매수가(또는 기준가) -8% = 1R, 사용자 확정 2026-11-02

breakeven_at_r = 3          # 3R에 닿으면 손절가를 본전(평균가)으로 올림 → 그 종목 CR 0, 사용자 확정 2026-11-03
take_profit_at_3r = 0.5     # 3R 도달 시 50% 익절 (남은 50%는 손절가 본전), 사용자 확정 2026-11-03
trail_ma = 20               # 3R 이후: 20일선을 종가로 하향 돌파하면 나머지 전략 매도, 사용자 확정 2026-11-03
cr_basis = "entry"          # (설명용 — 코드는 이 값을 읽지 않음) CR(현재 위험)은 매수가 기준: Σ max(0, 평균가 - 지금 손절가) × 수량

max_open_risk = 0.06        # CR 한도: 모든 종목이 동시에 손절돼도 최대 손실 = 계좌의 6%(3R, 90만 원), 사용자 확정 2026-11-03

# 아래는 Claude 제안 기본값 (사용자 확인 전)
red_light_risk = 0.01       # [미적용 · 제안값] 신호등 🔴일 때 1회 위험 1% — 어떤 코드도 읽지 않음. 규칙 고정 중이라 2027-01 재검토 때 정함
