# 기능 켜고 끄기 (Claude가 고침)
# monitoring: 섹터·감시 목록·검증실 메뉴와 감시 목록 계산·돌파 알림. 2026-11-04 잠시 중단 → 2026-11-10 '관찰 풀 한정'으로 다시 켬
#   scope = "pool": 감시 목록은 전략 보고서가 고른 관찰 풀(config/watch_pool.toml) + RS 70↑ 종목만. 풀 밖 신호는 '발굴'(참고) 등급
monitoring = true
scope = "pool"

# 텔레그램 발송 (Balance Lab 2.0, 2026-11-12 사용자 확정 Q2): 체크포인트 3회 + 즉시 알림(하루 상한) + 주간 리뷰·전략 보고서 요약 + 실패 알림만.
#   아침·리포트 브리핑·마감 리뷰·채널 정리·감시 목록 그림·자료실 요약은 웹에만 (telegram_send.py가 걸러 냄)
[telegram]
mode = "v2"
alert_daily_cap = 5
allow_files = ["checkpoint_", "weekly", "strategy_tg"]
