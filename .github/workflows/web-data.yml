# 웹 트레이딩룸 "새로고침" 버튼이 부르는 작업 (직접 실행만, 예약 없음)
# 최신 시세·리스크·인사이트로 데이터 JSON을 만들어 web-data 브랜치에 data.json 한 파일로 올린다.
# 웹 화면은 깃허브 연결로 이 파일을 읽어 다시 그린다. 주문 기능 없음.
name: 웹 데이터 새로고침

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 만들기
        run: python3 tools/web_build.py --data-out "$RUNNER_TEMP/pub/data.json"
      - name: web-data 브랜치에 올리기 (기록 없이 덮어쓰기)
        run: |
          cd "$RUNNER_TEMP/pub"
          git init -q
          git add data.json
          git -c user.name="web-data bot" -c user.email="actions@users.noreply.github.com" commit -qm "web data $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:web-data
