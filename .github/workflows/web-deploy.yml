# Balance Lab 웹 자동 배포 (Cloudflare Pages, 2026-11-11). Claude 토큰 0.
# 데이터를 만들어 site/ 폴더로 감싼 뒤 Cloudflare에 올린다. 저장소에는 아무것도 커밋하지 않는다.
# 로그인 잠금 확인 전(config/web.toml access_ready = false)에는 데이터 없는 안내 페이지만 올린다.
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (값은 사용자가 깃허브 설정에 직접 넣음)
name: 웹 배포 (Cloudflare)

on:
  workflow_dispatch:
  push:                       # 2026-11-23 밤: 저장소가 공개인 동안은 액션이 무료라 푸시 때마다 배포를 다시 켬(사용자 확정).
    branches: [main]          # ※ 12/1 비공개로 되돌릴 때는 아래 경로를 config/positions.toml · functions/** · config/web.toml 만 남긴다 (비공개 한도 월 2,000분)
    paths:
      - "reports/**"              # 체크포인트·소식 정리·주간 리뷰·감시 목록
      - "data/stock_memos/**"     # 종목 메모
      - "data/strategy/latest.json"
      - "data/strategy/tf/latest.json"
      - "config/watch_pool.toml"
      - "config/positions.toml"   # 샀어/팔았어 기록
      - "web/app.html"            # 화면 틀
      - "functions/**"            # 시세 중계(Cloudflare 함수)
      - "config/web.toml"
  schedule:                     # 한국 시각 기준, 글이 써지는 시각 약 20분 뒤 (화면 수정은 모아서 올리고 필요하면 수동 실행)
    - cron: "20 22 * * 0-4"     # 평일 07:20 (07시 체크포인트·소식 정리 뒤, 전체 계산)
    - cron: "20 1 * * 1-5"      # 평일 10:20
    - cron: "20 3 * * 1-5"      # 평일 12:20
    - cron: "20 6 * * 1-5"      # 평일 15:20
    - cron: "40 7 * * 1-5"      # 평일 16:40 (정규장 마감 뒤)
    - cron: "20 9 * * 1-5"      # 평일 18:20 (18시 체크포인트 뒤)
    - cron: "10 12 * * 1-5"     # 평일 21:10 (리포트 카드 18:40 · 종목 메모 20:10 · 깊이 읽기 20:15 뒤)
    - cron: "30 1 * * 6"        # 토 10:30 (전략 보고서 뒤)
    - cron: "40 3 * * 0,6"      # 토·일 12:40 (주말 정리 12시 뒤)
    - cron: "40 11 * * 0,6"     # 토·일 20:40 (주말 정리 20시 뒤)

permissions:
  contents: write   # 21:10 회차가 확정 감시 목록을 main에 올린다 (2026-11-24). 그 밖에는 읽기만 한다

concurrency:
  group: web-deploy
  cancel-in-progress: false   # 긴 전체 계산을 중간에 끊지 않고 다음 실행은 기다림

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 브리핑 카드 시각 = 보고서가 처음 커밋된 시각(git log). 얕게 받으면 모든 보고서가 배포 시각으로 찍힘 (2026-11-12 수정)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 지난 데이터·캐시 불러오기 (부분 새로고침용)
        uses: actions/cache/restore@v4
        with:
          path: |
            web/last_data.json
            data/cache
            data/stock_profiles.json
          key: web-${{ github.run_id }}
          restore-keys: web-
      - name: 잠금 확인 여부
        id: gate
        run: |
          if grep -Eq '^access_ready *= *true' config/web.toml; then echo "ready=1" >> "$GITHUB_OUTPUT"; else echo "ready=0" >> "$GITHUB_OUTPUT"; fi
      - name: 데이터 만들기
        if: steps.gate.outputs.ready == '1'
        run: |
          python3 tools/tg_channel.py collect || true
          H=$(TZ=Asia/Seoul date +%H)
          # 기업 메뉴 RS·가격 흐름·수익률은 시총 2천억↑ 전 종목 일봉 캐시가 있어야 계산된다 (없으면 비어 보임, 2026-11-11 수정)
          # 처음(캐시 없음)엔 전부 받고, 16시 회차엔 장마감 봉으로 전부 새로 받는다 (2~4분)
          if [ "$H" = "16" ]; then N=1000000000; else N=300; fi
          python3 -c "import sys; sys.path.insert(0,'tools'); import strategy_prep as S; print('daily cache', S.ensure_daily_cache(min_n=$N))" || true
          # 수급 오실레이터 (2026-11-13): 외국인·기관 순매수 받기 — 회차마다 4분 안에서 오래된 것부터(처음 채우기는 몇 회차에 나눠), 19시 회차가 저녁 확정치로 갱신
          timeout 300 python3 tools/flow_osc.py update --budget 240 || true
          timeout 150 python3 tools/stock_profile.py update --budget 100 || true   # 기본 카드: 새 상장·60일 지난 기업 개요만 (보통 몇 초)
          # 감시 목록 확정 (2026-11-24 · 11-25 사용자 확정): 감시 목록은 굳은 봉(20시 마감 가격)으로만 만든다 — 16:07 잠정 목록은 없앰.
          # 회차마다 '마지막 확정 거래일의 목록이 있는가'만 확인하고(--ensure, 있으면 몇 초), 없으면 만들어 저장소에 올린다(토큰 0).
          # 평일 21:10 회차가 보통 만들고, 그 회차가 늦거나 빠지면 다음 회차가 대신 만든다. GITHUB_TOKEN 푸시는 배포를 다시 부르지 않는다
          if timeout 900 python3 tools/screener.py --pool --ensure > /dev/null; then
            for f in data/bus data/radar/latest.json; do [ -e "$f" ] && git add "$f"; done
            if ! git diff --cached --quiet; then
              git -c user.name="balance-lab-bot" -c user.email="bot@users.noreply.github.com" commit -qm "감시 목록 확정 (20시 마감 가격 기준)" || true
              git push -q origin HEAD:main || { git stash -q; git pull -q --rebase origin main && git push -q origin HEAD:main; git stash pop -q; } || echo "확정 목록 푸시 실패"
            fi
          fi
          timeout 120 python3 tools/backtest.py --scorecard > /dev/null || true   # 감시 목록 성적표 + '실제 신호 30건' 세기 (2026-11-20, 11/5 이후 멈춰 있던 것)
          timeout 200 python3 tools/fundamentals.py update --budget 150 || true   # 실적·밸류에이션(2026-11-13): 네이버 재무·컨센서스, 실적 시즌은 하루·그 밖은 7일 지난 것부터
          if [ ! -f web/last_data.json ] || [ "$H" = "07" ]; then
            python3 tools/web_build.py
          else
            python3 tools/web_build.py --only analysis
          fi
      - name: 데이터 캐시 저장
        if: steps.gate.outputs.ready == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            web/last_data.json
            data/cache
            data/stock_profiles.json
          key: web-${{ github.run_id }}
      - name: 배포 폴더 만들기
        run: |
          if [ "${{ steps.gate.outputs.ready }}" = "1" ]; then python3 tools/web_site.py; else python3 tools/web_site.py --placeholder; fi
      - name: 장중 가격 스냅샷도 함께 (텔레그램은 보내지 않음)
        if: steps.gate.outputs.ready == '1'
        run: |
          git fetch -q origin alert-state 2>/dev/null && git show origin/alert-state:state.json > "$RUNNER_TEMP/st_dry.json" || echo '{}' > "$RUNNER_TEMP/st_dry.json"
          python3 tools/alerts.py --dry --force --state "$RUNNER_TEMP/st_dry.json" --live site/live.json > /dev/null || true
          [ -f site/highs_base.json ] && python3 tools/new_highs.py live --base site/highs_base.json --out site/highs_live.json > /dev/null || true
      - name: 배포 폴더 저장 (알림 작업이 장중 가격만 바꿔 다시 올릴 때 씀)
        if: steps.gate.outputs.ready == '1'
        uses: actions/cache/save@v4
        with:
          path: site
          key: site-${{ github.run_id }}
      - name: Cloudflare Pages에 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 pages project create balance-lab --production-branch main 2>/dev/null || true
          npx --yes wrangler@3.90.0 pages deploy site --project-name balance-lab --branch main --commit-dirty=true
      - name: 실패 알림 (텔레그램)   # 2026-11-20: 배포가 실패해도 아무도 모르던 것 보완
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 tools/telegram_send.py "🛠 [점검 알림] 웹 배포 실패 — Balance Lab 화면이 갱신되지 않았습니다. 깃허브 Actions '웹 배포' ${{ github.run_number }}번 기록을 확인하거나 Claude에게 '웹 배포 실패 확인해줘'라고 말해 주세요." || true
