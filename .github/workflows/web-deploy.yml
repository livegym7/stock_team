# Balance Lab 웹 자동 배포 (Cloudflare Pages, 2026-11-11). Claude 토큰 0.
# 데이터를 만들어 site/ 폴더로 감싼 뒤 Cloudflare에 올린다. 저장소에는 아무것도 커밋하지 않는다.
# 로그인 잠금 확인 전(config/web.toml access_ready = false)에는 데이터 없는 안내 페이지만 올린다.
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (값은 사용자가 깃허브 설정에 직접 넣음)
name: 웹 배포 (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/insight/**"
      - "data/strategy/latest.json"
      - "config/positions.toml"
      - "web/app.html"
      - "config/web.toml"
      - "reports/**"
  schedule:
    - cron: "40 22 * * 0-4"     # 한국 평일 07:40 (전체 계산)
    - cron: "40 3 * * 1-5"      # 한국 평일 12:40 (장중 가격은 알림 작업이 20분마다 live.json으로 따로 올림, 2026-11-12)
    - cron: "40 7 * * 1-5"      # 한국 평일 16:40 (마감 확정)
    - cron: "40 10 * * 1-5"     # 한국 평일 19:40 (리포트 카드·자료실 뒤)
    - cron: "30 1 * * 6"        # 한국 토 10:30 (전략 보고서 뒤)

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false   # 긴 전체 계산을 중간에 끊지 않고 다음 실행은 기다림

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 브리핑 카드 시각 = 보고서가 처음 커밋된 시각(git log). 얕게 받으면 모든 보고서가 배포 시각으로 찍힘 (2026-11-12 수정)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 지난 데이터·캐시 불러오기 (부분 새로고침용)
        uses: actions/cache/restore@v4
        with:
          path: |
            web/last_data.json
            data/cache
          key: web-${{ github.run_id }}
          restore-keys: web-
      - name: 잠금 확인 여부
        id: gate
        run: |
          if grep -Eq '^access_ready *= *true' config/web.toml; then echo "ready=1" >> "$GITHUB_OUTPUT"; else echo "ready=0" >> "$GITHUB_OUTPUT"; fi
      - name: 데이터 만들기
        if: steps.gate.outputs.ready == '1'
        run: |
          python3 tools/tg_channel.py collect || true
          H=$(TZ=Asia/Seoul date +%H)
          # 기업 메뉴 RS·가격 흐름·수익률은 시총 2천억↑ 전 종목 일봉 캐시가 있어야 계산된다 (없으면 비어 보임, 2026-11-11 수정)
          # 처음(캐시 없음)엔 전부 받고, 16시 회차엔 장마감 봉으로 전부 새로 받는다 (2~4분)
          if [ "$H" = "16" ]; then N=1000000000; else N=300; fi
          python3 -c "import sys; sys.path.insert(0,'tools'); import strategy_prep as S; print('daily cache', S.ensure_daily_cache(min_n=$N))" || true
          # 수급 오실레이터 (2026-11-13): 외국인·기관 순매수 받기 — 회차마다 4분 안에서 오래된 것부터(처음 채우기는 몇 회차에 나눠), 19시 회차가 저녁 확정치로 갱신
          timeout 300 python3 tools/flow_osc.py update --budget 240 || true
          timeout 150 python3 tools/stock_profile.py update --budget 100 || true   # 기본 카드: 새 상장·60일 지난 기업 개요만 (보통 몇 초)
          timeout 200 python3 tools/fundamentals.py update --budget 150 || true   # 실적·밸류에이션(2026-11-13): 네이버 재무·컨센서스, 실적 시즌은 하루·그 밖은 7일 지난 것부터
          if [ ! -f web/last_data.json ] || [ "$H" = "07" ]; then
            python3 tools/web_build.py
          else
            python3 tools/web_build.py --only analysis
          fi
      - name: 데이터 캐시 저장
        if: steps.gate.outputs.ready == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            web/last_data.json
            data/cache
          key: web-${{ github.run_id }}
      - name: 배포 폴더 만들기
        run: |
          if [ "${{ steps.gate.outputs.ready }}" = "1" ]; then python3 tools/web_site.py; else python3 tools/web_site.py --placeholder; fi
      - name: 장중 가격 스냅샷도 함께 (텔레그램은 보내지 않음)
        if: steps.gate.outputs.ready == '1'
        run: |
          git fetch -q origin alert-state 2>/dev/null && git show origin/alert-state:state.json > "$RUNNER_TEMP/st_dry.json" || echo '{}' > "$RUNNER_TEMP/st_dry.json"
          python3 tools/alerts.py --dry --force --state "$RUNNER_TEMP/st_dry.json" --live site/live.json > /dev/null || true
          [ -f site/highs_base.json ] && python3 tools/new_highs.py live --base site/highs_base.json --out site/highs_live.json > /dev/null || true
      - name: 배포 폴더 저장 (알림 작업이 장중 가격만 바꿔 다시 올릴 때 씀)
        if: steps.gate.outputs.ready == '1'
        uses: actions/cache/save@v4
        with:
          path: site
          key: site-${{ github.run_id }}
      - name: Cloudflare Pages에 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 pages project create balance-lab --production-branch main 2>/dev/null || true
          npx --yes wrangler@3.90.0 pages deploy site --project-name balance-lab --branch main --commit-dirty=true
