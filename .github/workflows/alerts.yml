# 보유 종목 장중 알림 (Claude 없이 파이썬 규칙만 → 토큰 사용 없음)
# 평일 장중 20분마다 tools/alerts.py 실행. 보낸 알림 기록은 alert-state 브랜치의 state.json 한 파일에 둔다.
# 깃허브 예약 실행은 몰릴 때 늦어지거나 건너뛸 수 있다 (알림 메시지에 확인 시각이 찍힘). 주문 기능 없음.
name: 보유 종목 장중 알림

on:
  schedule:
    - cron: "*/20 0-6 * * 1-5"   # UTC 00~06시 = 한국 09~15시 (15:40 이후는 도구가 알아서 건너뜀)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 지난 알림 기록 가져오기
        run: |
          mkdir -p "$RUNNER_TEMP/st"
          git fetch -q origin alert-state 2>/dev/null && git show origin/alert-state:state.json > "$RUNNER_TEMP/st/state.json" || echo '{}' > "$RUNNER_TEMP/st/state.json"
          git show origin/alert-state:highs_prev.json > "$RUNNER_TEMP/st/highs_prev.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/st/highs_prev.json"
      - name: 확인하고 새 알림만 텔레그램으로
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/alerts.py --collect --state "$RUNNER_TEMP/st/state.json" --live "$RUNNER_TEMP/live.json"
      # ---- 웹 화면 장중 가격 스냅샷 (2026-11-12, Balance Lab 2.0): 마지막 웹 배포 폴더에 live.json만 바꿔 다시 올림 ----
      - name: 웹 배포 폴더 불러오기
        id: site
        uses: actions/cache/restore@v4
        with:
          path: site
          key: site-${{ github.run_id }}
          restore-keys: site-
      - uses: actions/setup-node@v4
        if: steps.site.outputs.cache-matched-key != ''
        with:
          node-version: "20"
      - name: 웹에 장중 가격 올리기 (잠금 확인된 경우만)
        if: steps.site.outputs.cache-matched-key != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -Eq '^access_ready *= *true' config/web.toml && [ -f site/index.html ] && [ -f "$RUNNER_TEMP/live.json" ]; then
            cp "$RUNNER_TEMP/live.json" site/live.json
            # 장중 신고가 (2026-11-13, 09:20~15:45만 계산, 토큰 0)
            [ -f site/highs_base.json ] && python3 tools/new_highs.py live --base site/highs_base.json --out site/highs_live.json --prev "$RUNNER_TEMP/st/highs_prev.json" || true
            npx --yes wrangler@3.90.0 pages deploy site --project-name balance-lab --branch main --commit-dirty=true || true
          fi
      - name: 알림 기록 저장 (alert-state 브랜치, 기록 없이 덮어쓰기)
        run: |
          cd "$RUNNER_TEMP/st"
          git init -q
          git add state.json highs_prev.json 2>/dev/null || git add state.json
          git -c user.name="alert bot" -c user.email="actions@users.noreply.github.com" commit -qm "alert state $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:alert-state
