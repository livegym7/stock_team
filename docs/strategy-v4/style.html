<title>Balance Lab 주간 전략 샘플</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 회색 책상 위 흰 리포트 한 부. 표지(왼쪽 좁은 메타 칸 + 오른쪽 요약) → 회의 안건 6개 → 결론표 → 부록. Balance Lab 로고의 파란 점을 브랜드 색으로 */
:root{
  --desk:#eeeef2; --paper:#ffffff; --ink:#18181b; --muted:#5f5f6b; --faint:#8a8a96; --rule:#e2e2e8; --tint:#f6f6f9;
  --brand:#4553d0; --brand-soft:#eceeff; --on-brand:#ffffff;
  --up:#d42a2a; --down:#2160e0; --warn:#b45309; --warn-soft:#fdf2e1; --ok:#15803d;
  --head:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#09090b; --paper:#131317; --ink:#f2f2f4; --muted:#a8a8b3; --faint:#74747f; --rule:#2a2a31; --tint:#1a1a20;
  --brand:#8f9bff; --brand-soft:#1e2244; --on-brand:#0f1130; --up:#f87171; --down:#6aa6ff; --warn:#fbbf24; --warn-soft:#2b220e; --ok:#4ade80; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#09090b; --paper:#131317; --ink:#f2f2f4; --muted:#a8a8b3; --faint:#74747f; --rule:#2a2a31; --tint:#1a1a20;
  --brand:#8f9bff; --brand-soft:#1e2244; --on-brand:#0f1130; --up:#f87171; --down:#6aa6ff; --warn:#fbbf24; --warn-soft:#2b220e; --ok:#4ade80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.paper{max-width:1000px;margin:0 auto;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:0 1px 3px rgb(0 0 0 / .06)}
.pad{padding:28px 36px}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.3px;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .hi{color:var(--up);font-weight:700}
.src{color:var(--faint);font-size:12px}
small{font-size:12.5px}
/* 머리띠 */
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 36px;border-bottom:3px solid var(--brand);font-size:12.5px;color:var(--muted)}
.mast .brand{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;color:var(--ink);font-size:14px}
.mast .logo{width:22px;height:22px;border-radius:6px;background:var(--ink);position:relative;display:grid;place-items:center;color:var(--paper);font-size:12px;font-weight:700}
.mast .logo::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.stamp{border:1.5px solid var(--warn);color:var(--warn);border-radius:4px;padding:1px 8px;font-weight:700;font-size:11.5px;letter-spacing:.04em}
/* 표지 */
.cover{display:grid;grid-template-columns:250px minmax(0,1fr);border-bottom:1px solid var(--rule)}
.meta{grid-template-columns:minmax(0,1fr);background:var(--tint);border-right:1px solid var(--rule);padding:24px 20px;display:grid;gap:18px;align-content:start;font-size:13px}
.meta h4{font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.rating{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:12px}
.rating .big{font-family:var(--head);font-size:24px;font-weight:700;line-height:1.2}
.rating .sig{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:600}
.rating .sig i{width:10px;height:10px;border-radius:50%;background:var(--up)}
.kd{width:100%;border-collapse:collapse;font-size:12.5px}.kd td{padding:4px 0;border-bottom:1px solid var(--rule);vertical-align:top}.kd td:last-child{text-align:right;font-weight:600}
.kd tr:last-child td{border-bottom:0}
.team li{margin-bottom:4px}.team{margin:0;padding-left:16px;color:var(--muted)}.team b{color:var(--ink);font-weight:600}
.main{padding:26px 32px;min-width:0}
.eyebrow{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.06em}
.title{font-size:28px;line-height:1.35;margin:6px 0 8px}
.subtitle{color:var(--muted);font-size:15px;margin:0 0 18px}
.sum{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.sum li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}.sum li::before{content:"■";color:var(--brand);font-size:9px;padding-top:6px}
/* 결정 박스 */
.decision{margin-top:22px;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.decision>h3{background:var(--ink);color:var(--paper);font-size:13.5px;padding:8px 14px;letter-spacing:.02em}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.dgrid>div{padding:12px 14px;border-left:1px solid var(--rule);min-width:0}.dgrid>div:first-child{border-left:0}
.dgrid h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dgrid ul{margin:0;padding-left:16px;font-size:13.5px}.dgrid li{margin-bottom:3px}
.dnote{padding:8px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);background:var(--tint)}
/* 행동 칩 */
.act{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:4px;line-height:1.7;white-space:nowrap;border:1px solid}
.a-prep{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.a-watch{color:var(--ink);border-color:var(--faint)}
.a-avoid{color:var(--faint);border-color:var(--rule);background:var(--tint);text-decoration:line-through;text-decoration-color:var(--faint)}
/* 회의 순서 */
.agenda{display:flex;flex-wrap:wrap;gap:0;margin:0;padding:0;list-style:none;border:1px solid var(--rule);border-radius:6px;overflow:hidden;counter-reset:ag}
.agenda li{flex:1 1 150px;padding:10px 12px;border-left:1px solid var(--rule);font-size:12.5px;counter-increment:ag;min-width:0}.agenda li:first-child{border-left:0}
.agenda li::before{content:"안건 " counter(ag);display:block;font-size:11px;color:var(--brand);font-weight:700}
.agenda b{display:block;font-size:13.5px}
.agenda span{color:var(--muted)}
/* 섹션 */
section{border-top:1px solid var(--rule)}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sh .no{font-family:var(--head);font-weight:700;color:var(--paper);background:var(--brand);border-radius:4px;padding:0 8px;font-size:12.5px}
.sh h2{font-size:20px}
.sh .who{margin-left:auto;font-size:12.5px;color:var(--muted)}
.lead{font-size:15.5px;font-weight:600;margin:0 0 12px;line-height:1.65}
p{margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:14px}
.kpis>div{padding:10px 12px;border-left:1px solid var(--rule);border-top:1px solid var(--rule);margin:-1px 0 0 -1px}
.kpis small{display:block;color:var(--muted);font-size:11.5px}.kpis b{font-family:var(--head);font-size:19px;font-weight:600;display:block;line-height:1.35}
.kpis em{font-style:normal;font-size:11px;color:var(--faint)}
.rally{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;list-style:none;margin:6px 0 14px;padding:0}
.rally li{border-top:4px solid var(--rule);padding:6px 4px 0;font-size:12px;min-width:0}
.rally li.dn{border-top-color:var(--down)}.rally li.up{border-top-color:var(--up)}.rally li.wait{border-top:4px dashed var(--brand)}
.rally b{display:block;font-size:12.5px}.rally span{display:block;font-weight:600}.rally small{color:var(--muted);font-size:11.5px}
.flip{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13.5px}
/* 표 */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;margin:6px 0 4px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:8px 10px;background:var(--tint);border-bottom:1px solid var(--rule);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:center;vertical-align:top;white-space:nowrap}
.t tr:last-child td{border-bottom:0}.t .l{text-align:left}.t td.wrap{white-space:normal;min-width:220px}
.t .tot{font-family:var(--head);font-weight:700;font-size:15px}
.mnote{display:none;color:var(--muted);font-weight:400;white-space:normal}
.wnote{white-space:normal;min-width:240px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint)}.dots i.on{background:var(--ink);border-color:var(--ink)}
.conv{display:inline-flex;gap:2px;vertical-align:middle}.conv i{width:14px;height:5px;border-radius:1px;background:var(--rule)}.conv i.on{background:var(--brand)}
.st{font-weight:700;font-size:12px;padding:0 7px;border-radius:4px;border:1px solid}
.st.ok{color:var(--ok);border-color:var(--ok)}.st.no{color:var(--up);border-color:var(--up)}.st.mid{color:var(--warn);border-color:var(--warn)}
/* 데스크 보고 */
.desk{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.desk h3{font-size:15px;margin-bottom:2px}.desk .role{font-size:12px;color:var(--muted);margin-bottom:10px}
.desk ul{margin:0;padding-left:16px;font-size:13.5px}.desk li{margin-bottom:6px}
.chart{width:100%;height:auto;display:block}
.chart .lab{font-size:12px;fill:var(--ink)}.chart .val{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .tick{font-size:11px;fill:var(--faint)}.chart .grid{stroke:var(--rule);stroke-width:1}.chart .axis0{stroke:var(--faint);stroke-width:1}.chart .sep{stroke:var(--rule);stroke-dasharray:3 3}
.chart .bu{fill:var(--up)}.chart .bd{fill:var(--down)}
.figcap{font-size:12px;color:var(--muted);margin-top:4px}
figure{margin:0}
.tb{display:inline-flex;align-items:flex-end;gap:2px;height:20px;vertical-align:middle;margin-right:6px}.tb i{display:block;width:7px;background:var(--brand);opacity:.75;border-radius:1px 1px 0 0}.tb i:last-child{opacity:1}
.tbv{font-size:12px;color:var(--muted)}
/* 피치 */
.pitch{border:1px solid var(--rule);border-radius:6px;margin-bottom:22px;overflow:hidden}
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;padding:14px 18px;background:var(--tint);border-bottom:1px solid var(--rule);align-items:center}
.ph .tag{font-size:11.5px;font-weight:700;color:var(--brand);letter-spacing:.04em}
.ph h3{font-size:18px;line-height:1.4;margin-top:2px}
.ph .who{font-size:12px;color:var(--muted);margin-top:4px}
.pscore{display:grid;grid-template-columns:repeat(4,auto) auto;gap:2px 12px;font-size:11.5px;color:var(--muted);text-align:center;align-items:center}
.pscore b{font-family:var(--head);font-size:22px;color:var(--ink);grid-row:span 2;padding-left:8px;border-left:1px solid var(--rule)}
.pb{padding:16px 18px}
.thesis{font-size:15px;font-weight:600;margin:0 0 14px;padding-left:12px;border-left:3px solid var(--ink)}
.qa{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px 16px;margin-bottom:14px;font-size:14px}
.qa dt{font-weight:700;font-size:13px;color:var(--muted);padding-top:1px}.qa dd{margin:0;min-width:0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:4px 0 14px;list-style:none;padding:0}
.flow li{flex:1 1 150px;border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:12.5px;position:relative;min-width:0}
.flow li.h{border-style:dashed;border-color:var(--faint)}
.flow li b{display:block;font-size:13px}.flow li em{font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}.flow li.h em{color:var(--warn)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px;margin-bottom:14px}
.ev>div{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:13px;min-width:0}
.ev h4{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.debate{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:14px 0}
.debate>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.debate>div:first-child{border-top:0}
.debate .r{font-weight:700;font-size:12px;padding-top:2px}.debate .r.c{color:var(--up)}.debate .r.a{color:var(--ok)}
.debate>div.c{background:var(--tint)}
.kill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.kill>div{border-radius:6px;padding:10px 12px;font-size:13px}
.kill .k{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.kill .v{background:var(--tint);border:1px solid var(--rule)}
.kill h4{font-size:12.5px;margin-bottom:4px}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:1px solid var(--ink);border-radius:6px;font-size:13.5px}
.verdict b{font-family:var(--head)}
.rejected{border-style:dashed}
.rejected .ph{background:transparent}
/* 시나리오 */
.scn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scn>div{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-size:13.5px;min-width:0}
.scn h4{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.prob{height:6px;background:var(--tint);border-radius:3px;margin-bottom:8px;overflow:hidden}.prob i{display:block;height:100%;background:var(--ink)}
.scn dl{margin:0}.scn dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px}.scn dd{margin:0}
.chk{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:6px}
.chk li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px;align-items:baseline}
.chk li:first-child{border-top:0}.chk .d{font-weight:700;font-variant-numeric:tabular-nums}.chk .tg{font-size:11.5px;color:var(--muted)}
.pm{counter-reset:pm;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pm li{counter-increment:pm;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:14px}
.pm li::before{content:counter(pm);font-family:var(--head);font-weight:700;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:12px}
.book{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin-bottom:12px}
.book>div{border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.book small{display:block;color:var(--muted);font-size:11.5px}.book b{font-family:var(--head);font-size:18px}
.disc{font-size:12px;color:var(--muted);line-height:1.7;background:var(--tint)}
.disc h3{font-size:13px;color:var(--ink);margin-bottom:6px}
.refs{columns:2 300px;column-gap:24px;font-size:12.5px;margin:0;padding-left:16px}.refs li{break-inside:avoid;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 36px;border-top:3px solid var(--brand);font-size:11.5px;color:var(--faint)}
@media (max-width:760px){
  .pad{padding:20px 18px}.mast,.foot{padding-left:18px;padding-right:18px}
  .cover{grid-template-columns:minmax(0,1fr)}.meta{border-right:0;border-bottom:1px solid var(--rule);order:2}.main{padding:20px 18px}
  .title{font-size:22px}.dgrid,.scn,.kill{grid-template-columns:minmax(0,1fr)}.dgrid>div{border-left:0;border-top:1px solid var(--rule)}.dgrid>div:first-child{border-top:0}
  .qa{grid-template-columns:minmax(0,1fr);gap:2px}.qa dd{margin-bottom:8px}
  .ph{grid-template-columns:minmax(0,1fr)}.rally{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}
  .chk li{grid-template-columns:76px minmax(0,1fr)}.chk .tg{grid-column:2}
  .wnote{display:none}.mnote{display:block}
  .sh .who{margin-left:0;width:100%}
}
@media print{body{background:#fff}}
</style>
