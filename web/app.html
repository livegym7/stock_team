function spark(d){
  if(!d||!d.c||d.c.length<3)return "";
  const W=54,H=30,c=d.c,n=c.length,base=d.base??c[d.split-1]??c[0];
  const lo=Math.min(...c,base),hi=Math.max(...c,base),rg=(hi-lo)||1;
  const x=i=>(i/(n-1)*W).toFixed(1), y=v=>(H-2-(v-lo)/rg*(H-4)).toFixed(1);
  const path=(a,b)=>c.slice(a,b).map((v,i)=>(i?"L":"M")+x(a+i)+" "+y(v)).join("");
  const sp=Math.max(1,d.split), last=c[n-1], col=last>base?"var(--up)":last<base?"var(--down)":"var(--muted)";
  const today=path(sp-1,n), area=today+`L${x(n-1)} ${y(base)}L${x(sp-1)} ${y(base)}Z`;
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
   ${d.split>1?`<rect x="0" y="0" width="${x(sp-1)}" height="${H}" fill="var(--soft)"/>`:""}
   <line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-width=".6" stroke-dasharray="2 2"/>
   ${d.split>1?`<path d="${path(0,sp)}" fill="none" stroke="var(--muted)" stroke-width="1"/>`:""}
   <path d="${area}" fill="${col}" fill-opacity=".12" stroke="none"/>
   <path d="${today}" fill="none" stroke="${col}" stroke-width="1.3"/>
   <circle cx="${x(n-1)}" cy="${y(last)}" r="1.6" fill="${col}"/></svg>`;
}

function alerts(r){
  if(!r||r.error)return "";
  let a=(r.positions||[]).filter(p=>p.alert).map(p=>`⚠️ ${esc(p.name)} — ${esc(p.alert)}`);
  (r.positions||[]).filter(p=>p.to_stop_pct!=null&&p.to_stop_pct>-3).forEach(p=>a.push(`⚠️ ${esc(p.name)} 손절가까지 ${p.to_stop_pct}%`));
  if(r.warning)a.push("⚠️ "+esc(r.warning));
  return a.map(x=>`<div class="alert">${x}</div>`).join("");
}

const fam=k=>{k=String(k||"");return k.startsWith("report")?"report":(k=="close"||k=="weekly")?"review":k};
function tint(t){return esc(t).replace(/▲\s?[\d.,]+%?/g,m=>`<span class="up">${m}</span>`).replace(/▼\s?[\d.,]+%?/g,m=>`<span class="down">${m}</span>`)
  .replace(/(상향|호재)/g,'<span class="up">$1</span>').replace(/(하향|악재)/g,'<span class="down">$1</span>')
  .replace(/\(\+[\d.,]+%\)/g,m=>`<span class="up">${m}</span>`).replace(/\([−-][\d.,]+%\)/g,m=>`<span class="down">${m}</span>`);}

  const x=i=>(L+i/(n-1)*(W-L-R)).toFixed(1), y=v=>(T+(hi-v)/(hi-lo)*(H-T-B)).toFixed(1);

   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-4}" y="${+y(v)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${v>0?"+":""}${v}%</text>`).join("")}
   <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="3 3"/>
   ${dl.map(i=>`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="${i==0?"start":i==n-1?"end":"middle"}" fill="var(--muted)">${esc(P[i].date.slice(5))}</text>`).join("")}

function levels(p){
  const a=D.account||{}, unit=p.avg_price-p.initial_stop, be=a.breakeven_at_r||3, take=a.take_profit_at_3r;
  const L=[
   {r:-1,price:p.stop<p.avg_price?p.stop:p.initial_stop,label:"손절",act:`전량 손절 · 손실 ${w(-(p.avg_price-p.stop)*p.qty)}원 (${((p.stop/p.avg_price-1)*100).toFixed(1)}%)`,kind:"stop"},
   {r:0,price:p.avg_price,label:"본전",act:"평균 매수가",kind:"be"},
   {r:1,price:p.avg_price+unit,label:"1R",act:`평가이익 ${w(unit*p.qty)}원 · 아직 손절가 그대로`,kind:"info"},
   {r:2,price:p.avg_price+2*unit,label:"2R",act:`평가이익 ${w(2*unit*p.qty)}원`,kind:"info"},
   {r:be,price:p.avg_price+be*unit,label:be+"R",act:(take?`${Math.round(take*100)}% 익절 ${p.take_qty_at_3r}주(약 +${w(p.take_won_at_3r)}원 실현) + `:"")+`남은 물량 손절가를 본전 ${w(p.avg_price)}원으로 → CR ${w(p.cr_won)} → 0`,kind:"key"}];
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price&&m)L.push({r:-0.5,price:m,label:(p.trail_ma||20)+"일선",act:`종가로 하향 돌파하면 나머지 ${p.qty}주 전략 매도`,kind:"stop"});
  return L.filter((x,i)=>!(x.r==2&&be==2));
}
function nextStep(p){
  if(p.price==null)return "-";
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price)return m?`3R 이후 · ${p.trail_ma||20}일선 ${w(m)}원(${pc((m/p.price-1)*100)}) 종가 이탈 시 나머지 매도 · 손절가 본전 ${w(p.stop)}`:"3R 이후 · 20일선 종가 이탈 시 나머지 매도";
  const L=levels(p).filter(x=>x.r>0&&x.price>p.price);
  const k=L.find(x=>x.kind=="key")||L[0];
  return k?`${w(k.price)}원(+${((k.price/p.price-1)*100).toFixed(1)}%) 도달 시 ${p.take_qty_at_3r?p.take_qty_at_3r+"주 익절 + ":""}손절가 본전 · 이탈 시 ${w(p.stop)} 손절`:"3R 도달 → 50% 익절 + 손절가 본전으로 올릴 때";
}
function actionCard(p){
  const L=levels(p).sort((a,b)=>b.price-a.price), cur=p.price;
  let rows="", placed=false;
  L.forEach(x=>{
    if(!placed&&cur!=null&&cur>=x.price){rows+=`<div class="step now"><span class="lv">${w(cur)}</span><b>지금</b><span>${p.r_multiple>0?"+":""}${p.r_multiple?.toFixed(2)}R · 평가손익 ${w(p.pnl_won)}원</span><span></span></div>`;placed=true}
    const d=cur?((x.price/cur-1)*100):null;
    rows+=`<div class="step ${x.kind=="key"?"":""}"><span class="lv ${x.kind=="stop"?"down":x.kind=="key"?"up":""}">${w(x.price)}</span><b>${x.label}</b><span>${esc(x.act)}</span><span class="num muted">${d==null?"":pc(d)}</span></div>`;
  });
  if(!placed&&cur!=null)rows+=`<div class="step now"><span class="lv">${w(cur)}</span><b>지금</b><span>손절가 아래 · 손절 확인 필요</span><span></span></div>`;
  return `<div class="panel"><h2>${esc(p.name)} <small class="muted">${p.qty}주 · 1R = ${w(p.avg_price-p.initial_stop)}원/주</small></h2>
   <div style="font-size:13px"><b>다음 행동</b> · ${esc(nextStep(p))}</div><div class="ladder">${rows}</div>
   <div class="src">${esc(p.phase||"")} · 3R 이후에는 ${p.trail_ma||20}일선(지금 ${w(p["ma"+(p.trail_ma||20)])}원)을 종가로 깨면 나머지 매도</div></div>`;
}

     ${tops.map(g=>`<tr><td class="l">${esc(g)}</td>${hist.map(h=>{const r=h.ranks[g];return `<td class="num" style="${r&&r<=3?"background:var(--accent-soft);font-weight:600":r&&r<=8?"background:var(--soft)":""}">${r??"-"}</td>`}).join("")}</tr>`).join("")}</table></div>`:""}

/* ---------- 기업 ---------- */
const CSORT=[["rs","💪 강도순"],["imp","⭐ 중요도순"],["new","🆕 최근 리포트순"],["r1m","📈 1개월 수익률"],["rev","🔺 목표가 상향순"],["rep","📑 리포트 많은 순"],["name","가나다"]];
function cKey(c,k){const t=c.trend||{};if(k=="rev")return c.rev?c.rev.net*100+(c.rev.avg_chg||0):-9999;if(k=="new")return c.last_report?+c.last_report.replace(/\D/g,""):0;return k=="rs"?(t.rs??-1):k=="imp"?(t.importance??0)*1000+(t.rs??0):k=="r1m"?(t.r1m??-999):k=="rep"?c.n_reports*1000+(t.rs??0):0}
function rsBadge(t){if(t.rs==null)return `<span class="rsb muted">RS -</span>`;const cls=t.rs>=70?"hi":t.rs>=50?"mid":"lo";
  const ch=t.rs_chg4w;return `<span class="rsb ${cls}" title="RS = 1년 수익률 가중 백분위(0~99), 70↑이 강함. 화살표 = 4주 전 대비">RS ${t.rs}${ch?` <small class="${ch>0?"up":"down"}">${ch>0?"▲":"▼"}${Math.abs(ch)}</small>`:""}</span>`}
function miniLine(c,W=64,H=22){if(!c||c.length<3)return "";const lo=Math.min(...c),hi=Math.max(...c),rg=(hi-lo)||1,n=c.length;
  const col=c[n-1]>=c[0]?"var(--up)":"var(--down)";return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${c.map((v,i)=>(i?"L":"M")+(i/(n-1)*W).toFixed(1)+" "+(H-2-(v-lo)/rg*(H-4)).toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="1.3"/></svg>`}
function rsLine(h){if(!h||h.filter(x=>x!=null).length<3)return "";const W=260,H=70,n=h.length,y=v=>(H-6-(v/99)*(H-12)).toFixed(1),x=i=>(8+i/(n-1)*(W-16)).toFixed(1);
  const pts=h.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px" aria-label="RS 12주 추이"><line x1="8" x2="${W-8}" y1="${y(70)}" y2="${y(70)}" stroke="var(--up)" stroke-dasharray="3 3" stroke-width=".8"/><text x="${W-8}" y="${+y(70)-3}" font-size="9" text-anchor="end" fill="var(--up)">70</text>
   <path d="${pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join("")}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="var(--accent)"/>`).join("")}
   <text x="8" y="${H-1}" font-size="9" fill="var(--muted)">12주 전</text><text x="${W-8}" y="${H-1}" font-size="9" text-anchor="end" fill="var(--muted)">지금 ${h[n-1]??"-"}</text></svg>`}
function priceChart(ch,tg){if(!ch||!ch.c||ch.c.length<5)return `<div class="empty">6개월 차트는 기업 카드·보유·관심·리포트 2건 이상 종목만 보여 줍니다</div>`;
  if(!ch.ma20){ // 새 형식: 날짜 MMDD + 앞 50일 더 붙은 종가 → 이동평균을 여기서 계산
    const n0=ch.d.length, full=ch.c, off=full.length-n0, y0=+ch.d0;let y=y0;
    const dates=ch.d.map((md,i)=>{if(i&&md<ch.d[i-1])y++;return String(y)+md});
    const ma=k=>Array.from({length:n0},(_,i)=>{const j=off+i;if(j+1<k)return null;let t=0;for(let q=j-k+1;q<=j;q++)t+=full[q];return Math.round(t/k)});
    ch={d:dates,c:full.slice(off),ma20:ma(20),ma50:ma(50)};}
  const W=640,H=230,L=46,R=10,T=10,B=22,n=ch.c.length,idx=Object.fromEntries(ch.d.map((d,i)=>[d,i]));
  const T2=(tg||[]).map(t=>({...t,i:idx[t.t.replace(/-/g,"")]})).filter(t=>t.i!=null);
  const all=[...ch.c,...ch.ma50.filter(v=>v),...T2.map(t=>t.after)],lo=Math.min(...all)*0.98,hi=Math.max(...all)*1.02;
  const x=i=>(L+i/(n-1)*(W-L-R)).toFixed(1),y=v=>(T+(hi-v)/(hi-lo)*(H-T-B)).toFixed(1);
  const line=(a,st,sw,da="")=>{let d="";a.forEach((v,i)=>{if(v!=null)d+=(d&&a[i-1]!=null?"L":"M")+x(i)+" "+y(v)});return `<path d="${d}" fill="none" stroke="${st}" stroke-width="${sw}" ${da?`stroke-dasharray="${da}"`:""}/>`};
  const nice=v=>{const m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m},ticks=[lo+(hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1].map(nice),dl=[0,Math.floor(n/2),n-1],fd=d=>d.slice(4,6)+"/"+d.slice(6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="6개월 종가와 이동평균, 목표가">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-4}" y="${+y(v)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${w(v)}</text>`).join("")}
   ${dl.map(i=>`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="${i==0?"start":i==n-1?"end":"middle"}" fill="var(--muted)">${fd(ch.d[i])}</text>`).join("")}
   ${line(ch.ma50,"var(--muted)",1.1,"4 3")}${line(ch.ma20,"var(--accent)",1.2)}${line(ch.c,"var(--fg)",1.8)}
   ${T2.map(t=>`<circle cx="${x(t.i)}" cy="${y(t.after)}" r="4" fill="${t.dir=="상향"?"var(--up)":t.dir=="하향"?"var(--down)":"var(--muted)"}" fill-opacity=".85" stroke="var(--panel)" stroke-width="1"><title>${esc(t.t+" "+(t.broker||"")+" 목표가 "+w(t.after)+(t.dir?" ("+t.dir+")":""))}</title></circle>`).join("")}
  </svg><div class="src">— 종가 · <span style="color:var(--accent)">— 20일선</span> · <span class="muted">┄ 50일선</span> · 점 = 리포트 목표가 (<span class="up">● 상향</span> <span class="down">● 하향</span> <span class="muted">● 신규·유지</span>) · 출처: 네이버 일봉(비공식), 채널 리포트 요약(2차 자료)</div>`}

function curveSvg(c){
  if(!c||c.length<2)return "";
  const W=640,H=150,P=28,ys=c.map(p=>p[1]),lo=Math.min(0,...ys),hi=Math.max(0,...ys),rg=(hi-lo)||1;
  const x=i=>P+(i/(c.length-1))*(W-P-6), y=v=>6+(hi-v)/rg*(H-26);
  const d=c.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const tick=[hi,0,lo].filter((v,i,a)=>a.indexOf(v)==i);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="누적 R 곡선">
   ${tick.map(v=>`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v==0?'stroke-dasharray="3 3"':""}/><text x="${P-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(v)}R</text>`).join("")}
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
   <circle cx="${x(c.length-1)}" cy="${y(ys[ys.length-1])}" r="3" fill="var(--accent)"/>
   <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${esc(c[0][0])}</text><text x="${W-6}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(c[c.length-1][0])}</text></svg></div>`;
}

  <h3 style="margin-top:12px">데이터 출처 상태</h3><div class="chips">${(A.sources||[]).map(x=>`<span class="pill ${x.ok?"ok":"warn"}" title="${esc(x.note||"")}">${x.ok?"✅":"⚠️"} ${esc(x.name)}${x.note&&!x.ok?" · "+esc(x.note):""}</span>`).join("")}</div>
  <div class="src">결과 파일·기록으로 확인합니다(실행 로그 아님) · ⚠️ 늦음은 예정 시각 40분 뒤에도 결과가 없을 때 · 토큰: Claude 사용량 대략 · 작업을 끄거나 시간을 바꾸려면 Claude에게 말해 주세요 · 비공식 출처(네이버·Yahoo 등)는 주소가 바뀌면 멈출 수 있습니다</div></div>`;
}

  <div class="panel rulecard"><h2>📌 매매 규칙 한 장 <span class="pill">고정 2026-11-03 ~ 신호 30건 또는 2027-01-31</span></h2>

     <h3>✅ 종목 조건</h3><p>시장보다 강하고(<b>RS 70↑</b>) 거래가 충분한(<b>시총 2천억 · 거래대금 100억↑</b>) 상승 추세 종목. 돌파는 추세 조건 1개 정도 부족해도 OK</p></div>
    <div><h3>🛡️ 사고 나서</h3><ol><li>손절 <b>−8%</b> (1R = 30만 원)</li><li><b>3R(+24%)</b>에서 절반 익절 + 손절가 <b>본전</b></li><li>그 뒤 <b>20일선 종가 이탈</b> 시 나머지 정리</li><li>동시에 걸 수 있는 손실 최대 <b>3R(90만 원)</b></li></ol>
     <h3>👀 후보</h3><p>조건 1~2개 부족한 종목은 무엇이 부족한지와 함께 후보로. 고를지는 본인 판단</p></div>
   </div>
   <div class="src">근거: 백테스트 999건 · 승률 33% · 거래당 +0.44R (검증실). 세부 판정(셋업 A~F 등)은 Claude가 대신 함 · 원문 docs/rules.md</div></div>
  <div class="grid g2" style="margin-top:12px">
  <div class="panel"><h2>계좌·리스크 규칙</h2><table><tr><td class="l">자본</td><td class="num">${w(a.capital)}원</td></tr><tr><td class="l">1R (1회 손실 한도)</td><td class="num">${a.risk_per_trade*100}% = ${w(a.capital*a.risk_per_trade)}원</td></tr><tr><td class="l">처음 손절</td><td class="num">−${a.stop_pct*100}%</td></tr><tr><td class="l">본전 손절로 올리는 시점</td><td class="num">${a.breakeven_at_r}R</td></tr><tr><td class="l">${a.breakeven_at_r}R 익절</td><td class="num">${Math.round((a.take_profit_at_3r||0)*100)}%</td></tr><tr><td class="l">3R 이후 매도</td><td class="num">${a.trail_ma||20}일선 종가 이탈</td></tr><tr><td class="l">CR 한도 (동시 손절 최대)</td><td class="num">${a.max_open_risk*100}% = ${w(a.capital*a.max_open_risk)}원</td></tr><tr><td class="l">펀더멘털</td><td class="num">점수로만 표시</td></tr></table></div>
  <div class="panel"><h2>자동 일정 (평일)</h2><div class="tl">${(D.schedule||[]).map(s=>`<a href="#${s.kind=="watchlist"?"watch":"briefs"}"><span class="num">${s.time}</span><span>${esc(s.name)}</span><span class="pill ${s.done?"ok":""}">${esc(s.state)}</span></a>`).join("")}</div><div class="src">Claude 예약 작업 · 결과는 텔레그램과 이 화면에 같이 남음</div></div>
  <div class="panel"><h2>데이터 출처</h2><small>국내 시세·일봉: 네이버 증권(비공식) · 해외: Yahoo Finance(비공식) · 리포트·뉴스: 텔레그램 채널 요약(2차 자료) · 기업 사업 한 줄: Claude가 공개 정보로 작성</small></div>
  <div class="panel"><h2>지키는 선</h2><small>주문 기능 없음 · 매수·매도 단정 없음(근거와 반대 근거) · 숫자에 출처와 시각 · 증권사 PDF 원본 저장 안 함</small></div></div>

/* ---------- 새로고침 (깃허브 Actions로 최신 데이터 만들기) ---------- */
const RF={state:"idle",msg:"",started:null};
function refreshBox(){
  return `<div class="rbox"><div><b>데이터 ${esc(D.built_at)} 기준</b>${RF.msg?`<br><span>${esc(RF.msg)}</span>`:""}<br><small class="muted">자동 갱신: 평일 08~17시 매시 12분 · 지금 바로는 Claude에게 "새로고침해줘"</small></div></div>`;
}
function paintRefresh(){document.querySelectorAll(".rslot").forEach(el=>el.innerHTML=refreshBox());const s=$("#side .built");if(s)s.innerHTML=refreshBox()+"<br>"+esc(D.note)}
const REFRESH_HELP="Claude 대화에서 \"분석 새로고침\" / \"모니터링 새로고침\" / \"채널만 새로고침\"이라고 말해 주세요";
// 웹에서 직접 새로고침하는 방법은 없음(깃허브 커넥터 없음, 2026-11-04). 버튼은 대화 명령을 안내만 한다.
let RFP=null;
const RFTXT={analysis:["분석 새로고침","시세·계좌·브리핑 목록·기업·채널 (약 1~2분)"],monitoring:["모니터링 새로고침","감시 목록 다시 계산 + 섹터·검증실 (약 5~10분)"]};
function partAt(part){const P=D.parts||{};return P[part]||D.built_at}
function refreshPart(part){RFP=RFP===part?null:part;nav();const m=$("#more");if(m&&m.classList.contains("open"))m.classList.add("open")}
function rfNote(part){if(RFP!==part)return "";const [cmd,what]=RFTXT[part];
  return `<div class="rfnote">Claude 대화에서 <b>"${cmd}"</b>이라고 말해 주세요 · ${what}<br><small>마지막 갱신 ${esc(partAt(part))} · 자동: ${part=="analysis"?"평일 08~17시 매시 12분 (채널·리포트 정리까지) + 07:32·10:32·15:32·16:32 전체":"평일 16:07 감시 목록 → 16:32 반영"}</small></div>`}
function doRefresh(){RF.state="idle";RF.msg=REFRESH_HELP;paintRefresh();return Promise.resolve(false)}
/* ---------- 라우터 ---------- */
const VIEWS={research:viewResearch,home:viewHome,briefs:viewBriefs,portfolio:viewPortfolio,watch:viewWatch,sectors:viewSectors,companies:viewCompanies,channels:viewChannels,lab:viewLab,config:viewConfig};
function render(){
  if(!D){$("#main").innerHTML=`<div class="empty">데이터가 없습니다. tools/web_build.py로 만들어 주세요</div>`;return}
  nav(); $("#more").classList.remove("open");
  const r=route(); $("#main").innerHTML=`<div class="view">${VIEWS[r]()}</div>`;
  if(r=="portfolio")calc();
}
document.addEventListener("click",e=>{
  const q=e.target.closest("[data-cq]"); if(q){ui.cq=q.dataset.cq;save();location.hash="companies";return}
  const lt=e.target.closest("[data-lt]"); if(lt){ui.lt=lt.dataset.lt;save();render();return}
  if(e.target.closest("#refreshBtn")){doRefresh();return}
  const rfb=e.target.closest("[data-rf]"); if(rfb){refreshPart(rfb.dataset.rf);return}
  const cm=e.target.closest("[data-calm],[data-cald],[data-calk],[data-calrel]");
  if(cm){if(cm.dataset.calrel)ui.calRel=!ui.calRel;if(cm.dataset.calm)ui.calm=cm.dataset.calm;if(cm.dataset.cald)ui.cald=cm.dataset.cald;
    if(cm.dataset.calk){const o=new Set(ui.calOff||[]);o.has(cm.dataset.calk)?o.delete(cm.dataset.calk):o.add(cm.dataset.calk);ui.calOff=[...o]}save();render();return}
  const rt=e.target.closest("[data-rt]"); if(rt){ui.rt=rt.dataset.rt;save();render();return}
  const rk=e.target.closest("[data-rk]"); if(rk){ui.rk=rk.dataset.rk;ui.rd=null;save();render();return}
  const rd=e.target.closest("[data-rd]"); if(rd){ui.rd=rd.dataset.rd;ui.rt="docs";save();render();window.scrollTo(0,0);return}
  const cs=e.target.closest("[data-cs]"); if(cs){ui.cs=cs.dataset.cs;save();render();return}
  const t=e.target.closest("[data-bk],[data-bf],[data-wg],[data-ws],[data-wd],[data-cc],[data-ct],[data-go],[data-kind],.post");
  if(!t)return;
  if(t.dataset.bk!=null){ui.bk=t.dataset.bk;ui.bf=null}
  else if(t.dataset.bf!=null)ui.bf=t.dataset.bf;
  else if(t.dataset.wg!=null){ui.wg=t.dataset.wg;ui.ws=""}
  else if(t.dataset.ws!=null)ui.ws=t.dataset.ws;
  else if(t.dataset.wd!=null)ui.wd=ui.wd==t.dataset.wd?null:t.dataset.wd;
  else if(t.dataset.cc!=null){ui.cc=t.dataset.cc;save();render();if(innerWidth<=820){const d=$("#cdetail");d&&d.scrollIntoView({behavior:"smooth",block:"start"})}return}
  else if(t.dataset.ct!=null)ui.ct=t.dataset.ct;
  else if(t.dataset.go){location.hash=t.dataset.go;return}
  else if(t.dataset.kind){const k=t.dataset.kind;if(k!="watchlist"){ui.bk=k;ui.bf=null}save();return}
  else if(t.classList.contains("post")){if(e.target.closest("a"))return;t.classList.toggle("open");return}
  save();render();
});
document.addEventListener("input",e=>{
  if(["cEntry","cStop","cPct"].includes(e.target.id))calc();
  if(e.target.id=="cq"){ui.cq=e.target.value;save();const pos=e.target.selectionStart;render();const el=$("#cq");el.focus();el.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{if(e.target.id=="chSel"){ui.ch=e.target.value;save();render()}if(e.target.id=="bSel"){ui.bf=e.target.value;save();render()}if(e.target.id=="cfSel"){ui.cf=e.target.value;save();render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-bnav]");if(!b||b.disabled)return;const o=$("#bSel");if(!o)return;const i=o.selectedIndex-parseInt(b.dataset.bnav);if(i>=0&&i<o.options.length){ui.bf=o.options[i].value;save();render()}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
