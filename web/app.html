<script>
let D = /*__DATA__*/null;
/* 새로고침으로 받은 더 최신 데이터가 이 브라우저에 있으면 그걸 쓴다 */
try{const c=JSON.parse(localStorage.getItem("tr-data")||"null");if(c&&D&&c.built_at>D.built_at)D=c}catch(e){}
/* 메뉴 5개 (2026-11-10 다시 설계): 질문 하나에 메뉴 하나 — 오늘(지금 장은?) · 흐름(무슨 얘기·리포트?) · 전략(어디서 싸우나?) · 내 매매(내 돈·규칙·복기) · 더보기(일정·설정) */
const MENU=[["home","오늘","◎"],["flow","시장","≡"],["strategy","전략","◐"],["stock","종목","◇"],["trade","내 매매","₩"],["more","더보기","⚙"]];   // 2026-11-12 Balance Lab 2.0: 종목 메뉴 신설, 흐름 → 시장
// 옛 메뉴 id → 새 메뉴 + 탭 (기존 링크·data-go 호환)
const ALIAS={briefs:["flow","digest"],channels:["flow","channels"],portfolio:["trade",null],companies:["stock",null],research:["strategy","research"],watch:["strategy","watch"],sectors:["strategy","watch"],lab:["strategy","watch"],config:["more",null]};
const GROUPS_ALL=[["메뉴","analysis",["home","flow","strategy","stock","trade","more"]]];
const MON_OFF=!!(D&&D.features&&D.features.monitoring===false);
const GROUPS=GROUPS_ALL;
const TABS=["home","flow","strategy","stock","trade"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const w=n=>n==null||isNaN(n)?"-":Math.round(n).toLocaleString("ko-KR");
const pc=(n,d=1)=>n==null||isNaN(n)?"-":(n>0?"+":"")+Number(n).toFixed(d)+"%";
const cls=n=>n>0?"up":n<0?"down":"";
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ui=store.get("tr-ui",{});
function save(){store.set("tr-ui",ui)}
/* 밝게/어둡게: ui.theme 없으면 기기 설정을 따름 */
function isDark(){return ui.theme?ui.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){if(ui.theme)document.documentElement.dataset.theme=ui.theme;else delete document.documentElement.dataset.theme}
function toggleTheme(){ui.theme=isDark()?"light":"dark";save();applyTheme();nav()}
applyTheme();
function src(t){return `<div class="src">${esc(t)}</div>`}

const RAIL={};
function nav(){
  const cur=route();
  $("#side").innerHTML=
    GROUPS.map(([g,rf,ks],gi)=>(gi?`<div class="rsep" title="${esc(g)}"></div>`:"")+
      ks.map(k=>{const [,n,i]=MENU.find(m=>m[0]==k);return `<a href="#${k}" class="${cur==k?"on":""}" title="${esc(n)}"><span class="ico">${i}</span>${esc(RAIL[k]||n)}</a>`}).join("")).join("")+
    `<div class="rbot"><button class="rbtn" data-theme-t="1" title="밝게/어둡게 바꾸기" aria-label="밝게/어둡게 바꾸기">${isDark()?"☀":"☾"}</button><button class="rbtn" data-rfpop="1" title="새로고침 안내" aria-label="새로고침 안내">↻</button><div class="rtime num">${esc((D.built_at||"").slice(5))}<br>기준</div></div>`;
  $("#pillnav").innerHTML=MENU.map(([k,n])=>`<a href="#${k}" class="${cur==k?"on":""}">${esc(n)}</a>`).join("")+`<span class="sp"></span><span class="num muted" style="font-size:12px">데이터 ${ageTag(D.built_at,"화면 데이터")}${D.live?` · 가격 ${ageTag(D.live.at,"장중 가격(20분 스냅샷)")}`:""}</span><button class="rbtn" data-theme-t="1" title="밝게/어둡게 바꾸기" aria-label="밝게/어둡게 바꾸기">${isDark()?"☀":"☾"}</button>`;
  $("#tabbar").innerHTML=TABS.map(k=>{const m=MENU.find(x=>x[0]==k);return `<a href="#${k}" class="${cur==k?"on":""}"><span class="ico">${m[2]}</span>${m[1]}</a>`}).join("")+
    `<button id="moreBtn" class="${TABS.includes(cur)?"":"on"}"><span class="ico">⋯</span>더보기</button>`;
  $("#more").innerHTML=GROUPS.map(([g,rf,ks])=>`<div class="ngroup mg"><span>${g}${rf?` <small class="num">${esc(partAt(rf).slice(5))}</small>`:""}</span>${rf?`<button class="rfb" data-rf="${rf}" aria-label="${g} 새로고침">↻ 새로고침</button>`:""}</div>${rf?`<div class="mg">${rfNote(rf)}</div>`:""}`+
    ks.filter(k=>!TABS.includes(k)).map(k=>{const [,n,i]=MENU.find(m=>m[0]==k);return `<a href="#${k}">${i} ${n}</a>`}).join("")).join("")+
    `<button class="chip themeb" data-theme-t="1">${isDark()?"☀ 밝은 화면으로":"☾ 어두운 화면으로"}</button>`;
  $("#more").innerHTML="";
  $("#moreBtn").onclick=()=>{location.hash="more"};
  $("#rfpop").innerHTML=`<h4>새로고침 안내</h4>${refreshBox()}`+GROUPS.filter(g=>g[1]).map(([g,rf])=>{const [cmd,what]=RFTXT[rf];return `<div class="rfnote"><b>${esc(g)}</b> · ${esc(partAt(rf))} 갱신<br>Claude 대화에서 <b>"${cmd}"</b>이라고 말해 주세요 · ${what}</div>`}).join("")+`<small class="muted">${esc(D.note||"")}</small>`;
}
function route(){let h=location.hash.slice(1);
  if(/^s\d{6}$/.test(h)){ui.sc=h.slice(1);return "stock"}   // 종목 페이지 #s000660
  if(h=="stock")ui.sc=null;
  if(ALIAS[h]){const [pg,tab]=ALIAS[h];if(tab){if(pg=="flow")ui.ft=tab;if(pg=="strategy")ui.st=tab;save()}h=pg}
  return MENU.some(m=>m[0]==h)?h:"home"}
const stripH1=h=>h.replace(/<h1[^>]*>[\s\S]*?<\/h1>/,"").replace(/^(\s*<div class="sub"[^>]*>[\s\S]*?<\/div>)/,"");

/* ---------- 오늘 ---------- */
function latestOpinion(){return (D.briefs||[]).find(b=>b.opinion)}
function marketTiles(){
  const m=D.market||{}, K={KOSPI:"^KS11",KOSDAQ:"^KQ11"};
  const rows=[...(m.kr||[]).map(r=>({n:r.index,p:r.price,c:r.change_pct,s:K[r.code]})),...(m.us||[]).map(r=>({n:r.name,p:r.price,c:r.change_pct,s:r.symbol}))];
  if(!rows.length)return `<div class="empty">시세를 불러오지 못했습니다</div>`;
  return `<div class="tiles">${rows.map(r=>`<div class="tile"><span>${esc(r.n)}</span><div class="trow"><div><b>${r.p>=1000?w(r.p):Number(r.p).toFixed(2)}</b><small class="num ${cls(r.c)}">${pc(r.c,2)}</small></div>${spark((m.spark||{})[r.s])}</div></div>`).join("")}</div>${src((m.source||"")+" · 회색 = 전일, 색 = 당일, 점선 = 전일 종가")}`;
}
function spark(d,W=54,H=30){
  if(!d||!d.c||d.c.length<3)return "";
  const c=d.c,n=c.length,base=d.base??c[d.split-1]??c[0];
  const lo=Math.min(...c,base),hi=Math.max(...c,base),rg=(hi-lo)||1;
  const x=i=>(i/(n-1)*W).toFixed(1), y=v=>(H-2-(v-lo)/rg*(H-4)).toFixed(1);
  const path=(a,b)=>c.slice(a,b).map((v,i)=>(i?"L":"M")+x(a+i)+" "+y(v)).join("");

  const H=t=>tint(t);
  const splitParen=t=>{const m=t.match(/^(.*?)\s*(\((?:출처|기간|영업이익|네이버|현지|오늘|어제|00:|0\d:|1\d:)[^)]*\)|\s—\s.*)$/);return m&&m[1].length>1?`${H(m[1])} <small>${H(m[2].replace(/^\s—\s/,"— "))}</small>`:H(t)};
  const isItem=t=>/^([①-⑳]|\d️?⃣|\d+\.\s)/u.test(t);
  const isSec=t=>!isItem(t)&&!/^(⭐|☆|⚠️|※|범례|⚖️|리스크:|\(|↳)/u.test(t)&&(t.replace(/\(.*?\)/g,"").length<=46)&&(EMO.test(t)||/^\d+\)\s/.test(t)||/^그 밖에/.test(t))&&!(/^[🔴🔵🔺🔽🆕➖⭐]/u.test(t)&&/[:：]|\d/.test(t));
  for(;i<L.length;i++){
    const raw=L[i], t=raw.trim();
    if(i==0){out.push(`<div class="brt">${H(t)}</div>`);continue}
    if(!t){if(inMeta&&out.length>1)inMeta=false;continue}
    if(/^범례|^※/.test(t)){out.push(`<div class="brf">${H(t)}</div>`);continue}
    if(/^⚖️/u.test(t)){out.push(`<div class="brn">${H(t)}</div>`);continue}
    if(isSec(t)){inMeta=false;let x=t.replace(/[:：]$/,"");
      if(!EMO.test(x)){const ic=(BR_ICON.find(([r])=>r.test(x))||[0,"▸"])[1];x=ic+" "+x.replace(/^\d+\)\s*/,"")}
      sec=x;out.push(`<div class="brh${/Claude 의견/.test(x)?" op":""}">${splitParen(x)}</div>`);continue}
    if(inMeta){out.push(`<div class="brm">${H(t)}</div>`);continue}
    if(isItem(t)){const m=t.match(/^([①-⑳]|\d️?⃣|\d+\.)\s*(.*)$/u);
      const body=m[2], long=body.length>60;
      out.push(`<div class="bri${long?" long":""}"><span class="bn">${esc(m[1].replace(/️?⃣/,"").replace(".",""))}</span><span>${H(body)}</span></div>`);continue}
    if(/^\s*↳/.test(raw)){out.push(`<div class="brr">${H(t)}</div>`);continue}
    if(/^[-•·]\s*/.test(t)){let x=t.replace(/^[-•·]\s*/,""),e=x.match(/^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})\uFE0F?)\s*/u),bd="•";if(e){bd=e[1];x=x.slice(e[0].length)}
      out.push(`<div class="brb"><span class="bd${e?" e":""}">${bd}</span><span>${sentLines(x)}</span></div>`);continue}
    if(/^🌡️/u.test(t)){out.push(`<div class="brmood">${H(t)}</div>`);continue}
    if(/^\s/.test(raw)){const m=t.match(/^(사업|오늘|근거|1개월|반대|볼 것|이유)\s*[:：]\s*(.*)$/);
      out.push(`<div class="brx">${m?`<span class="bl">${esc(m[1])}</span>${sentLines(m[2])}`:sentLines(t)}</div>`);continue}
    out.push(`<div class="brp${/^⚠️/u.test(t)?" w":""}${/^⭐/u.test(t)?" own":""}">${sentLines(t)}</div>`);
  }
  return out.join("");
}

const fam=k=>{k=String(k||"");return k.startsWith("report")?"report":(k=="close"||k=="weekly")?"review":k};
let NAME_RE=null;
function boldNames(h){   // 종목명 굵게 (보유 종목은 강조색). 긴 이름 먼저 맞춘다
  if(NAME_RE===null){const N=D&&D.stock_names||[];NAME_RE=N.length?new RegExp("("+N.map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g"):false}
  if(!NAME_RE)return h;
  const own=new Set(((D.risk||{}).positions||[]).map(p=>p.name));
  return h.split(/(<[^>]+>)/).map(s=>s.startsWith("<")?s:s.replace(NAME_RE,m=>`<b class="stk${own.has(m)?" own":""}">${m}</b>`)).join("");
}
function tint(t){return boldNames(esc(t).replace(/▲\s?[\d.,]+%?/g,m=>`<span class="up">${m}</span>`).replace(/▼\s?[\d.,]+%?/g,m=>`<span class="down">${m}</span>`)
  .replace(/(상향|호재)/g,'<span class="up">$1</span>').replace(/(하향|악재)/g,'<span class="down">$1</span>')
  .replace(/\(\+[\d.,]+%\)/g,m=>`<span class="up">${m}</span>`).replace(/\([−-][\d.,]+%\)/g,m=>`<span class="down">${m}</span>`));}

function levels(p){
  const a=D.account||{}, unit=p.avg_price-p.initial_stop, be=a.breakeven_at_r||3, take=a.take_profit_at_3r;
  const L=[
   {r:-1,price:p.stop<p.avg_price?p.stop:p.initial_stop,label:"손절",act:`전량 손절 · 손실 ${w(-(p.avg_price-p.stop)*p.qty)}원 (${((p.stop/p.avg_price-1)*100).toFixed(1)}%)`,kind:"stop"},
   {r:0,price:p.avg_price,label:"본전",act:"평균 매수가",kind:"be"},
   {r:1,price:p.avg_price+unit,label:"1R",act:`평가이익 ${w(unit*p.qty)}원 · 아직 손절가 그대로`,kind:"info"},
   {r:2,price:p.avg_price+2*unit,label:"2R",act:`평가이익 ${w(2*unit*p.qty)}원`,kind:"info"},
   {r:be,price:p.avg_price+be*unit,label:be+"R",act:(take?`${Math.round(take*100)}% 익절 ${p.take_qty_at_3r}주(약 +${w(p.take_won_at_3r)}원 실현) + `:"")+`남은 물량 손절가를 본전 ${w(p.avg_price)}원으로 → CR ${w(p.cr_won)} → 0`,kind:"key"}];
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price&&m)L.push({r:-0.5,price:m,label:(p.trail_ma||20)+"일선",act:`종가로 하향 돌파하면 나머지 ${p.qty}주 전략 매도`,kind:"stop"});
  return L.filter((x,i)=>!(x.r==2&&be==2));
}
function nextStep(p){
  if(p.price==null)return "-";
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price)return m?`3R 이후 · ${p.trail_ma||20}일선 ${w(m)}원(${pc((m/p.price-1)*100)}) 종가 이탈 시 나머지 매도 · 손절가 본전 ${w(p.stop)}`:"3R 이후 · 20일선 종가 이탈 시 나머지 매도";
  const L=levels(p).filter(x=>x.r>0&&x.price>p.price);
  const k=L.find(x=>x.kind=="key")||L[0];
  return k?`${w(k.price)}원(+${((k.price/p.price-1)*100).toFixed(1)}%) 도달 시 ${p.take_qty_at_3r?p.take_qty_at_3r+"주 익절 + ":""}손절가 본전 · 이탈 시 ${w(p.stop)} 손절`:"3R 도달 → 50% 익절 + 손절가 본전으로 올릴 때";
}
function actionCard(p){
  const L=levels(p).sort((a,b)=>b.price-a.price), cur=p.price;
  let rows="", placed=false;
  L.forEach(x=>{
    if(!placed&&cur!=null&&cur>=x.price){rows+=`<div class="step now"><span class="lv">${w(cur)}</span><b>지금</b><span>${p.r_multiple>0?"+":""}${p.r_multiple?.toFixed(2)}R · 평가손익 ${w(p.pnl_won)}원</span><span></span></div>`;placed=true}
    const d=cur?((x.price/cur-1)*100):null;
    rows+=`<div class="step ${x.kind=="key"?"":""}"><span class="lv ${x.kind=="stop"?"down":x.kind=="key"?"up":""}">${w(x.price)}</span><b>${x.label}</b><span>${esc(x.act)}</span><span class="num muted">${d==null?"":pc(d)}</span></div>`;
  });
  if(!placed&&cur!=null)rows+=`<div class="step now"><span class="lv">${w(cur)}</span><b>지금</b><span>손절가 아래 · 손절 확인 필요</span><span></span></div>`;
  return `<div class="panel"><h2>${esc(p.name)} <small class="muted">${p.qty}주 · 1R = ${w(p.avg_price-p.initial_stop)}원/주</small></h2>
   <div style="font-size:13px"><b>다음 행동</b> · ${esc(nextStep(p))}</div><div class="ladder">${rows}</div>
   <div class="src">${esc(p.phase||"")} · 3R 이후에는 ${p.trail_ma||20}일선(지금 ${w(p["ma"+(p.trail_ma||20)])}원)을 종가로 깨면 나머지 매도</div></div>`;
}
function calc(){
  const r=D.risk||{}, e=parseFloat(($("#cEntry")||{}).value), pctv=parseFloat(($("#cPct")||{}).value);
  let s=parseFloat(($("#cStop")||{}).value); if(!isNaN(pctv)&&pctv>0){s=Math.round(e*(1-pctv/100));$("#cStop").value=s}

  const budget=Math.min(r.one_r_account_won||0,r.room_for_new_risk_won||0), q=Math.floor(budget/(e-s));

function buyCheck(x){

  const L=x.levels||{}, R=D.risk||{}, entry=Math.max(L.breakout||x.close, x.close), stop=L.stop_1r||Math.round(entry*0.92);
  const per=entry-stop, oneR=R.one_r_account_won||((D.account||{}).capital||0)*((D.account||{}).risk_per_trade||0.02), room=R.room_for_new_risk_won??oneR;
  const q1=per>0?Math.floor(oneR/per):0, q2=per>0?Math.floor(Math.max(0,room)/per):0, qty=Math.min(q1,q2), cap=(D.account||{}).capital||1;

    [x.ia=="동반 상승"?"ok":isBrk?"bad":"warn","업종 동반 상승 (돌파 필수)",`${esc(x.ia||"-")} · 업종 ${esc(x.group||"")} 상승 비율 ${x.ia_up_share??"-"}% · 중앙값 ${x.ia_median??"-"}%`],
    [(x.vol_ratio||0)>=1.5?"ok":"warn","거래량 1.5배 (돌파 날)",`50일 평균 대비 ${x.vol_ratio??"-"}배 ${x.date?"("+esc(String(x.date).slice(4))+")":""}`],
    [x.close>=(L.breakout||1e12)?"ok":"warn","종가로 기준가 위",`종가 ${w(x.close)} / 기준가 ${w(L.breakout)}`],
    [room>=oneR?"ok":room>0?"warn":"bad","남은 위험 여유 (CR 한도 6%)",`새로 걸 수 있는 위험 ${w(room)}원 · 1R ${w(oneR)}원`],
    [ev.length?"warn":"ok","가까운 실적·IR 일정 (10일)",ev.length?ev.map(e=>`${e.date.slice(5)} ${esc(e.name)} (D-${e.days})`).join(", ")+" — 발표 전후 변동 주의":"없음"],
    [reg&&reg.light=="red"?"warn":"ok","시장 신호등",reg?`${esc(reg.light=="red"?"빨강":reg.light=="yellow"?"노랑":"초록")} · ${esc(reg.text||"")}`:"-"],
    [rev?(rev.net>0?"ok":rev.net<0?"warn":"ok"):"ok","증권사 목표가 흐름 (31일)",rev?`순상향 ${rev.net>0?"+":""}${rev.net} · 평균 변경 ${pc(rev.avg_chg)}`:"리포트 없음"],
    [ea?(ea.verdict=="쇼크"?"warn":"ok"):"ok","최근 실적",ea?`${esc(ea.period)} ${esc(ea.verdict||"")} ${ea.op_surprise!=null?pc(ea.op_surprise):""}`:"정보 없음"],
    [held?"warn":"ok","이미 보유 중인지",held?"보유 중 — 추가 매수는 규칙상 따로 판단":"아님"],
  ];

function rsLine(h){if(!h||h.filter(x=>x!=null).length<3)return "";const W=260,H=70,n=h.length,y=v=>(H-6-(v/99)*(H-12)).toFixed(1),x=i=>(8+i/(n-1)*(W-16)).toFixed(1);
  const pts=h.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px" aria-label="RS 12주 추이"><line x1="8" x2="${W-8}" y1="${y(70)}" y2="${y(70)}" stroke="var(--up)" stroke-dasharray="3 3" stroke-width=".8"/><text x="${W-8}" y="${+y(70)-3}" font-size="9" text-anchor="end" fill="var(--up)">70</text>
   <path d="${pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join("")}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="var(--accent)"/>`).join("")}
   <text x="8" y="${H-1}" font-size="9" fill="var(--muted)">12주 전</text><text x="${W-8}" y="${H-1}" font-size="9" text-anchor="end" fill="var(--muted)">지금 ${h[n-1]??"-"}</text></svg>`}
function priceChart(ch,tg){if(!ch||!ch.c||ch.c.length<5)return `<div class="empty">6개월 차트는 기업 카드·보유·관심·리포트 2건 이상 종목만 보여 줍니다</div>`;
  if(!ch.ma20){ // 새 형식: 날짜 MMDD + 앞 50일 더 붙은 종가 → 이동평균을 여기서 계산
    const n0=ch.d.length, full=ch.c, off=full.length-n0, y0=+ch.d0;let y=y0;
    const dates=ch.d.map((md,i)=>{if(i&&md<ch.d[i-1])y++;return String(y)+md});
    const ma=k=>Array.from({length:n0},(_,i)=>{const j=off+i;if(j+1<k)return null;let t=0;for(let q=j-k+1;q<=j;q++)t+=full[q];return Math.round(t/k)});
    ch={d:dates,c:full.slice(off),ma20:ma(20),ma50:ma(50)};}
  const W=640,H=230,L=46,R=10,T=10,B=22,n=ch.c.length,idx=Object.fromEntries(ch.d.map((d,i)=>[d,i]));
  const T2=(tg||[]).map(t=>({...t,i:idx[t.t.replace(/-/g,"")]})).filter(t=>t.i!=null);
  const all=[...ch.c,...ch.ma50.filter(v=>v),...T2.map(t=>t.after)],lo=Math.min(...all)*0.98,hi=Math.max(...all)*1.02;
  const x=i=>(L+i/(n-1)*(W-L-R)).toFixed(1),y=v=>(T+(hi-v)/(hi-lo)*(H-T-B)).toFixed(1);
  const line=(a,st,sw,da="")=>{let d="";a.forEach((v,i)=>{if(v!=null)d+=(d&&a[i-1]!=null?"L":"M")+x(i)+" "+y(v)});return `<path d="${d}" fill="none" stroke="${st}" stroke-width="${sw}" ${da?`stroke-dasharray="${da}"`:""}/>`};
  const nice=v=>{const m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m},ticks=[lo+(hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1].map(nice),dl=[0,Math.floor(n/2),n-1],fd=d=>d.slice(4,6)+"/"+d.slice(6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="6개월 종가와 이동평균, 목표가">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-4}" y="${+y(v)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${w(v)}</text>`).join("")}
   ${dl.map(i=>`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="${i==0?"start":i==n-1?"end":"middle"}" fill="var(--muted)">${fd(ch.d[i])}</text>`).join("")}
   ${line(ch.ma50,"var(--muted)",1.1,"4 3")}${line(ch.ma20,"var(--accent)",1.2)}${line(ch.c,"var(--fg)",1.8)}
   ${T2.map(t=>`<circle cx="${x(t.i)}" cy="${y(t.after)}" r="4" fill="${t.dir=="상향"?"var(--up)":t.dir=="하향"?"var(--down)":"var(--muted)"}" fill-opacity=".85" stroke="var(--panel)" stroke-width="1"><title>${esc(t.t+" "+(t.broker||"")+" 목표가 "+w(t.after)+(t.dir?" ("+t.dir+")":""))}</title></circle>`).join("")}
  </svg><div class="src">— 종가 · <span style="color:var(--accent)">— 20일선</span> · <span class="muted">┄ 50일선</span> · 점 = 리포트 목표가 (<span class="up">● 상향</span> <span class="down">● 하향</span> <span class="muted">● 신규·유지</span>) · 출처: 네이버 일봉(비공식), 채널 리포트 요약(2차 자료)</div>`}
function peerTable(sel){

  if(P.length<2)return "";
  return `<h3>같은 업종 비교 · ${esc(g)} <small class="muted">기업 메뉴에 있는 ${P.length}개 · 강도순</small></h3><div class="tw"><table><tr><th class="l">종목</th><th>강도</th><th>1개월</th><th>3개월</th><th>고점 대비</th><th>시총(억)</th><th>리포트 🔺/🔽</th><th>최근 실적</th></tr>
  ${P.slice(0,12).map(c=>{const t=c.trend||{};return `<tr class="${c.code==sel.code?"me":"click"}" ${c.code==sel.code?"":`data-cc="${c.code}"`}><td class="l"><b>${esc(c.name)}</b></td><td>${rsBadge(t)}</td><td>${retC(t.r1m)}</td><td>${retC(t.r3m)}</td><td>${retC(t.off_high)}</td><td class="num">${w(c.market_cap_eok)}</td><td class="num"><span class="up">${c.up}</span>/<span class="down">${c.down}</span></td><td>${earnLine(c.code,true)||"-"}</td></tr>`}).join("")}</table></div>
  <div class="src">업종 = 사용자 분류표(sector_map custom) · 시세 네이버 일봉(비공식) · 리포트 31일 채널 요약</div>`}
function companyDetail(sel,t,mark){return `<article class="panel" id="cdetail"><h2 style="font-size:18px">${mark(sel)}${esc(sel.name)} <small class="muted num">${sel.code}</small> ${rsBadge(t)}</h2>
   <div class="chips"><span class="pill">${esc(sel.sector)}${sel.detail&&sel.detail!=sel.sector?" › "+esc(sel.detail):""}</span>${sel.card===false?`<span class="pill">기업 카드 준비 중</span>`:""}${(sel.sub_sectors||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join("")}${sel.market_cap_eok?`<span class="pill">시총 ${w(sel.market_cap_eok)}억</span>`:""}${t.importance!=null?`<span class="pill" title="보유 40·관심 20 + 1개월 리포트 + 7일 채널 언급 + 목표가 쏠림">중요도 ${t.importance}</span>`:""}</div>

   <div class="grid g4" style="margin-bottom:10px">
    <div class="tile"><span>종가 ${t.date?esc(t.date.slice(4,6)+"/"+t.date.slice(6)):""}</span><b>${w(t.price)}</b></div>
    <div class="tile"><span>1주 / 1개월 / 3개월</span><b style="font-size:15px"><span class="${t.r1w>0?"up":"down"}">${pc(t.r1w)}</span> / <span class="${t.r1m>0?"up":"down"}">${pc(t.r1m)}</span> / <span class="${t.r3m>0?"up":"down"}">${pc(t.r3m)}</span></b></div>
    <div class="tile"><span>52주 고점 대비</span><b>${pc(t.off_high)}</b></div>
    <div class="tile"><span>이동평균선</span><b style="font-size:15px">${t.above20==null?"-":`20일 ${t.above20?'<span class="up">위</span>':'<span class="down">아래</span>'} · 50일 ${t.above50?'<span class="up">위</span>':'<span class="down">아래</span>'}`}</b></div></div>
   <h3>가격 흐름</h3>${stockChartBox(sel)}${flowBox(sel)}
   ${peerTable(sel)}
   <h3>강도(RS) 추이 · 12주 <small class="muted">${t.rs_chg4w==null?"":`4주 전보다 ${t.rs_chg4w>0?"+":""}${t.rs_chg4w}`}</small></h3>${rsLine(t.rs_hist)}
   ${consChart(sel.cons,t.price)}
   ${(sel.rev&&sel.rev.brokers||[]).length?`<h3>증권사별 최근 목표가 <small class="muted">31일 순상향 ${sel.rev.net>0?"+":""}${sel.rev.net} · 평균 변경 ${pc(sel.rev.avg_chg)}</small></h3><div class="tw"><table><tr><th class="l">증권사</th><th>날짜</th><th>이전</th><th>새 목표가</th><th>변경</th></tr>${sel.rev.brokers.map(b=>`<tr><td class="l">${b.dir=="상향"?"🔺":b.dir=="하향"?"🔽":"🆕"} ${esc(b.broker)}</td><td class="num">${esc(b.time.slice(5))}</td><td class="num">${w(b.before)}</td><td class="num"><b>${w(b.after)}</b></td><td>${b.before?retC((b.after/b.before-1)*100):"-"}</td></tr>`).join("")}</table></div>`:""}
   <h3>리포트 · 최근 1개월 <small class="muted">${sel.n_reports}건 · <span class="up">🔺${sel.up}</span> <span class="down">🔽${sel.down}</span> · 목표가 중앙값 ${w(sel.median_target)}${sel.median_target&&t.price?` (현재가 대비 ${pc((sel.median_target/t.price-1)*100)})`:""}</small></h3>
   ${(sel.reports||[]).map(r=>`<div class="post"><div class="meta"><span class="num">${esc(r.time)}</span><b>${esc(r.broker||"")}</b><span class="num">${r.before?w(r.before)+" → ":""}${w(r.after)}</span>${r.direction?`<span class="${r.direction=="상향"?"up":r.direction=="하향"?"down":"muted"}">${r.direction=="상향"?"🔺":r.direction=="하향"?"🔽":"🆕"} ${esc(r.direction)}</span>`:""}</div><div>${(r.points||[]).map(x=>"· "+esc(x)).join("<br>")}</div></div>`).join("")||`<div class="empty">최근 1개월 리포트 없음</div>`}
   ${src("사업 한 줄 업데이트 "+(sel.updated||"")+" · 출처 "+(sel.sources||[]).join(", ")+" · 시세 네이버 일봉(비공식)")}</article>`}

/* ---------- 딥리서치 ---------- */
function rsChip(name,code){const R=D.research||{},t=(R.trend||{})[code]||{};
  return `<button class="rchip" data-cq="${esc(name)}" title="기업 메뉴에서 보기">${esc(name)}${t.rs!=null?` <span class="rsb ${t.rs>=70?"hi":t.rs>=50?"mid":"lo"}">RS ${t.rs}</span>`:""}${t.r1m!=null?` <small class="${cls(t.r1m)}">${pc(t.r1m)}</small>`:""}</button>`}
function codeOf(name){const R=D.research||{};for(const d of R.docs||[])for(const s of d.stocks||[])if(s.name==name&&s.code)return s.code;const c=(D.companies||[]).find(c=>c.name==name);return c?c.code:null}
function docRef(id){const d=((D.research||{}).docs||[]).find(x=>x.file_id==id);return d?`<button class="linkb" data-rd="${esc(id)}">${esc((d.broker||"")+" "+(d.date||"").slice(5))} ${esc(d.subject||d.title)}</button>`:""}
function viewResearch(){

  <div class="grid g2" style="margin-bottom:16px">

   <div class="panel"><h3>🚀 주도주 후보</h3>${(S.leading_stocks||[]).map(x=>`<div class="insrow">${rsChip(x.name,codeOf(x.name))} <small class="muted">${esc(x.market||"")}</small><div style="font-size:13px">${tint(x.why||"")}</div></div>`).join("")||`<div class="empty">-</div>`}</div></div>

function curveSvg(c){
  if(!c||c.length<2)return "";
  const W=640,H=150,P=28,ys=c.map(p=>p[1]),lo=Math.min(0,...ys),hi=Math.max(0,...ys),rg=(hi-lo)||1;
  const x=i=>P+(i/(c.length-1))*(W-P-6), y=v=>6+(hi-v)/rg*(H-26);
  const d=c.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const tick=[hi,0,lo].filter((v,i,a)=>a.indexOf(v)==i);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="누적 R 곡선">
   ${tick.map(v=>`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v==0?'stroke-dasharray="3 3"':""}/><text x="${P-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(v)}R</text>`).join("")}
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
   <circle cx="${x(c.length-1)}" cy="${y(ys[ys.length-1])}" r="3" fill="var(--accent)"/>
   <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${esc(c[0][0])}</text><text x="${W-6}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(c[c.length-1][0])}</text></svg></div>`;
}

function flowTimeline(){

  const byDay={}; list.forEach(b=>(byDay[b.date]=byDay[b.date]||[]).push(b));

  const first=b=>{const t=(b.text||"").split("\n").map(x=>x.trim()).filter(x=>x&&!/^#/.test(x)&&!/^_.*_$/.test(x)&&!/^\*.*\*$/.test(x));
    let i=t.findIndex(x=>/^💡/.test(x)); let line=i>=0?t[i].replace(/^💡\s*(Claude\s*의견|CLAUDE\s*의견|의견)?\s*:?\s*/i,""):"";

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function cho(t){return [...String(t||"")].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join("")}
function gFind(q){
  q=String(q||"").trim().toLowerCase(); if(!q)return [];
  const isCho=/^[ㄱ-ㅎ]+$/.test(q);
  return (D.companies||[]).map(c=>{const n=c.name.toLowerCase();let sc=0;
    if(n==q||c.code==q)sc=100;else if(n.startsWith(q)||(c.code||"").startsWith(q))sc=80;else if(n.includes(q))sc=60;
    else if(isCho&&cho(c.name).startsWith(q))sc=50;else if(isCho&&cho(c.name).includes(q))sc=40;
    else if((c.group||"").toLowerCase().includes(q)||(c.detail||"").toLowerCase().includes(q))sc=20;
    return [c,sc]}).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||(b[0].market_cap_eok||0)-(a[0].market_cap_eok||0)||(b[0].n_reports||0)-(a[0].n_reports||0)).slice(0,12).map(x=>x[0]);
}

function trendFrom(rows,rs){const c=rows.map(r=>r[4]),n=c.length,last=c[n-1],hi=Math.max(...rows.slice(-250).map(r=>r[2])),ma20=n>=20?c.slice(-20).reduce((a,b)=>a+b,0)/20:null;
  return {rs,price:last,r1m:n>21?(last/c[n-22]-1)*100:null,off_high:(last/hi-1)*100,above20:ma20?last>=ma20:null,live_chg:n>1?(last/c[n-2]-1)*100:null}}
function popTarget(el){const t=el&&el.closest&&el.closest("[data-cq],b.stk,[data-pop]");if(!t||t.closest("#pop"))return null;const n=(t.dataset.cq||t.dataset.pop||t.textContent||"").trim();const c=stockByName(n);return c?{el:t,c}:null}
function showPop(t){
  const c=t.c, x=c.trend||{}, q=liveQuote(c.code), price=(q&&q.price)||x.price, chg=q?q.change_pct:x.live_chg;
  const pos=((D.risk||{}).positions||[]).find(p=>p.code==c.code), pool=((D.watch_pool||{}).themes||[]).find(th=>(th.stocks||[]).some(s=>s.code==c.code));
  const P=$("#pop");popFor=c.code;
  P.innerHTML=`<div class="pph"><b>${pos?"⭐ ":""}${esc(c.name)}</b> <small class="muted">${esc(c.group||c.sector||"")}</small></div>
   <div class="ppb"><div class="ppc" id="ppc"><div class="muted" style="font-size:12px;padding:30px 0;text-align:center">차트 불러오는 중…</div></div>
   <div class="ppi"><div><b class="num">${w(price)}</b> <span class="num ${cls(chg)}">${chg!=null?pc(chg,2):""}</span></div>
    <div>1개월 <span class="num ${cls(x.r1m)}">${pc(x.r1m)}</span></div><div>고점 대비 <span class="num">${pc(x.off_high)}</span></div>
    <div>RS <b class="num">${x.rs??"-"}</b>${x.rs_chg4w?` <small class="${x.rs_chg4w>0?"up":"down"}">${x.rs_chg4w>0?"▲":"▼"}${Math.abs(x.rs_chg4w)}</small>`:""}</div>
    <div>20일선 ${x.above20==null?"-":x.above20?'<span class="up">위</span>':'<span class="down">아래</span>'}</div>${flowP(c.code)!=null?`<div>${flowTag(c.code)}</div>`:""}
    ${c.pseudo?'<div class="muted">기업 카드 없음</div>':""}<div ${c.pseudo?"hidden":""}>리포트 ${c.n_reports||0} <small><span class="up">${c.up||0}</span>/<span class="down">${c.down||0}</span></small></div>
    ${pos?`<div class="up">보유 · 손절까지 ${pc(pos.to_stop_pct)}</div>`:""}${pool?`<div>관찰 풀 ${esc(pool.id)}</div>`:""}</div></div>
   <a class="ppl" href="#s${c.code}">종목 페이지 ›</a>`;
  const r=t.el.getBoundingClientRect(),pw=Math.min(430,innerWidth-16);P.style.width=pw+"px";P.hidden=false;const ph=P.offsetHeight;let left,top;
  if(HOVER&&popM){/* 마우스 커서 옆(오른쪽, 자리 없으면 왼쪽)에 띄워 아래 줄을 가리지 않게 (2026-11-13) */
    left=popM.x+18;if(left+pw>innerWidth-8)left=popM.x-18-pw;left=Math.min(Math.max(8,left),innerWidth-pw-8);
    top=Math.min(Math.max(8,popM.y-ph/2),innerHeight-ph-8);
  }else{left=Math.min(Math.max(8,r.left),innerWidth-pw-8);top=r.bottom+6;if(top+ph>innerHeight-8)top=Math.max(8,r.top-ph-6)}
  P.style.left=left+"px";P.style.top=top+"px";
  ohlcGet(c.code).then(rows=>{if(popFor!=c.code)return;if(c.pseudo&&rows&&!c.trend.price){c.trend=trendFrom(rows,c.trend.rs);popFor=null;showPop(t);return}const el=$("#ppc");if(!el)return;el.innerHTML=rows?candleChart(rows,{w:260,h:140,n:200,ma:[20,60],vp:true,axis:false,dates:true,label:true}):`<div class="muted" style="font-size:12px;padding:30px 0;text-align:center">차트 없음</div>`});
}
function hidePop(){const P=$("#pop");if(P){P.hidden=true;popFor=null}}
let popM=null;document.addEventListener("mousemove",e=>{if(HOVER)popM={x:e.clientX,y:e.clientY}},{passive:true});
document.addEventListener("mouseover",e=>{if(!HOVER)return;if(e.target.closest("#pop")){clearTimeout(popT);return}const t=popTarget(e.target);clearTimeout(popT);
  if(t)popT=setTimeout(()=>{if(popFor!=t.c.code)showPop(t)},280);else if(popFor)popT=setTimeout(hidePop,220)});
document.addEventListener("click",e=>{
  if(e.target.closest("#pop")){if(e.target.closest(".ppl"))hidePop();return}
  if(!HOVER){const t=popTarget(e.target);if(t&&popFor!=t.c.code){e.preventDefault();e.stopPropagation();showPop(t);return}}
  hidePop();
},true);
window.addEventListener("scroll",()=>{if(!HOVER)return;hidePop()},{passive:true});
/* ---------- 화면이 열려 있는 동안 1분마다 시세 (웹에서만, /api/quote) ---------- */
function quoteCodes(){const s=new Set(((D.risk||{}).positions||[]).map(p=>p.code));((D.watch_pool||{}).themes||[]).forEach(th=>(th.stocks||[]).forEach(x=>s.add(x.code)));if(ui.sc)s.add(ui.sc);return [...s].filter(Boolean).slice(0,80)}
function busy(){const a=document.activeElement;return (a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))||popFor}
function applyQuote(j){
  const pos=((D.risk||{}).positions||[]).map(p=>{const q=j.quotes[p.code];if(!q||!q.price)return {code:p.code};const risk=p.avg_price-(p.initial_stop??p.stop);
    return {code:p.code,price:q.price,price_at:q.at,pnl_won:Math.round((q.price-p.avg_price)*p.qty),r_multiple:risk>0?Math.round((q.price-p.avg_price)/risk*100)/100:p.r_multiple,to_stop_pct:Math.round((p.stop/q.price-1)*1000)/10,value_won:Math.round(q.price*p.qty)}});
  applyLive({at:j.at,markets:j.markets,quotes:j.quotes,positions:pos.filter(p=>p.price),alerts:(D.live||{}).alerts});
}
function pollQuotes(force){
  if(!/^https?:/.test(location.protocol)||document.hidden)return;
  const k=kstNow(),hm=k.getUTCHours()*100+k.getUTCMinutes(),wd=k.getUTCDay();
  if(!force&&(wd==0||wd==6||hm<855||hm>1545))return;
  fetch("api/quote?flows=1&codes="+quoteCodes().join(","),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.markets&&j.markets.length){applyQuote(j);if(!busy())render()}}).catch(()=>{});
}
function render(){
  if(!D){$("#main").innerHTML=`<div class="empty">데이터가 없습니다. tools/web_build.py로 만들어 주세요</div>`;return}
  nav(); $("#more").classList.remove("open"); $("#tape").innerHTML=tapeHtml();
  const r=route();let html;
  try{html=VIEWS[r]()}catch(err){   // 2026-11-13: 화면 하나가 오류 나면 이전 화면에 멈춰 있던 문제 → 저장된 화면 설정을 비우고 한 번 더, 그래도 안 되면 오류 문구 표시
    console.error(err);const RESET={stock:["sc","cc","cq","cf","cs","recent"],strategy:["st","wsort","cc","cq"],flow:["ft","hw","hr","hp","hm","hs"],trade:["cEntry","cStop"],home:["mkOpen"],more:[]};
    (RESET[r]||[]).forEach(k=>{delete ui[k]});save();
    try{html=VIEWS[r]()}catch(e2){html=`<div class="empty" style="text-align:left"><b>이 화면을 그리다 오류가 났습니다.</b><br>이 문구를 캡처해서 Claude에게 보여 주세요.<br><small class="mono">${esc(r+": "+(e2&&e2.message||e2)+" / "+String(e2&&e2.stack||"").split("\n").slice(0,3).join(" ← "))}</small></div>`}
    window.__lastErr=r+": "+(err&&err.message||err);
    html=`<div class="src" style="border:1px dashed var(--warn);border-radius:8px;padding:6px 10px;margin-bottom:10px">⚠ 저장된 화면 설정 때문에 오류가 나서 이 메뉴 설정을 초기화했습니다 · 원인: <span class="mono">${esc(window.__lastErr)} ← ${esc(String(err&&err.stack||"").split("\n")[1]||"")}</span></div>`+html;
  }
  $("#main").innerHTML=`<div class="view">${html}</div>`;
  if(r=="trade")calc();
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-t]")){toggleTheme();return}
  if(e.target.closest("[data-rfpop]")){$("#rfpop").classList.toggle("open");return}
  if(!e.target.closest("#rfpop"))$("#rfpop").classList.remove("open");
  const q=e.target.closest("[data-cq]"); if(q){const cc=stockByName(q.dataset.cq);if(cc){ui.gsel=null;location.hash="s"+cc.code;return}if(q.closest(".gcard"))ui.gsel=null;ui.cq=q.dataset.cq;save();if(location.hash=="#stock")render();else location.hash="stock";return}
  const lt=e.target.closest("[data-lt]"); if(lt){ui.lt=lt.dataset.lt;save();render();return}
  if(e.target.closest("#refreshBtn")){doRefresh();return}
  const rfb=e.target.closest("[data-rf]"); if(rfb){refreshPart(rfb.dataset.rf);return}
  const cm=e.target.closest("[data-calm],[data-cald],[data-calk],[data-calrel]");
  if(cm){if(cm.dataset.calrel)ui.calRel=!ui.calRel;if(cm.dataset.calm)ui.calm=cm.dataset.calm;if(cm.dataset.cald)ui.cald=cm.dataset.cald;
    if(cm.dataset.calk){const o=new Set(ui.calOff||[]);o.has(cm.dataset.calk)?o.delete(cm.dataset.calk):o.add(cm.dataset.calk);ui.calOff=[...o]}save();render();return}
  const ft=e.target.closest("[data-ft]"); if(ft){ui.ft=ft.dataset.ft;save();if(ft.tagName=="A"){e.preventDefault();location.hash="flow"}render();return}
  const hk=e.target.closest("[data-hk]"); if(hk){ui[hk.dataset.hk]=hk.dataset.hv;save();render();return}
  const hso=e.target.closest("[data-hsort]"); if(hso){const k=hso.dataset.hsort,c=ui.hs||{k:"vol_x",d:"desc"},first=k=="name"||k=="group"?"asc":"desc";ui.hs=c.k==k?(c.d==first?{k,d:first=="asc"?"desc":"asc"}:{k:"vol_x",d:"desc"}):{k,d:first};save();render();return}
  const stb=e.target.closest("[data-st]"); if(stb){ui.st=stb.dataset.st;save();if(stb.tagName=="A"){return}render();return}
  const rcf=e.target.closest("[data-rcf]"); if(rcf){ui.rcf=rcf.dataset.rcf;save();render();return}
  const rcs=e.target.closest("[data-rcs]"); if(rcs){ui.rcs=rcs.dataset.rcs;save();render();return}
  const rt=e.target.closest("[data-rt]"); if(rt){ui.rt=rt.dataset.rt;save();render();return}
  const rk=e.target.closest("[data-rk]"); if(rk){ui.rk=rk.dataset.rk;ui.rd=null;save();render();return}
  const rp=e.target.closest("[data-rp]"); if(rp){ui.rp=rp.dataset.rp;save();render();return}
  const rg=e.target.closest("[data-rg]"); if(rg){ui.rgc=ui.rgc||{};ui.rgc[rg.dataset.rg]=!ui.rgc[rg.dataset.rg];save();render();return}
  const rgm=e.target.closest("[data-rgm]"); if(rgm){ui.rgm=ui.rgm||{};ui.rgm[rgm.dataset.rgm]=1;save();render();return}
  const rd=e.target.closest("[data-rd]"); if(rd){const inList=!!rd.closest(".rlist");ui.rd=rd.dataset.rd;ui.rt="docs";save();render();if(!inList)window.scrollTo(0,0);else{const el=document.querySelector(".rrow.on");if(el&&window.innerWidth<=820)el.scrollIntoView({block:"start"})}return}
  const scw=e.target.closest("[data-scw]"); if(scw){ui.scw=scw.dataset.scw;save();render();return}
  const wso=e.target.closest("[data-wsort]"); if(wso){const k=wso.dataset.wsort,c=ui.wsort||{},first=k=="stock"||k=="stage"||k=="setup"?"asc":"desc",second=first=="asc"?"desc":"asc";   // 정렬 순환: 첫 방향 → 반대 방향 → 기본 순서 (2026-11-11)
    ui.wsort=c.k!=k?{k,d:first}:c.d==first?{k,d:second}:{};save();render();return}
  const cs=e.target.closest("[data-cs]"); if(cs){ui.cs=cs.dataset.cs;save();render();return}
  const t=e.target.closest("[data-bk],[data-bf],[data-wg],[data-ws],[data-wd],[data-cc],[data-ct],[data-go],[data-kind],.post");
  if(!t)return;
  if(t.dataset.bk!=null){ui.bk=t.dataset.bk;ui.bf=null}
  else if(t.dataset.bf!=null)ui.bf=(ui.bf==t.dataset.bf&&t.classList.contains("tch"))?null:t.dataset.bf;
  else if(t.dataset.wg!=null){ui.wg=t.dataset.wg;ui.ws=""}
  else if(t.dataset.ws!=null)ui.ws=t.dataset.ws;
  else if(t.dataset.wd!=null)ui.wd=ui.wd==t.dataset.wd?null:t.dataset.wd;
  else if(t.dataset.cc!=null){ui.cc=t.dataset.cc;save();render();if(innerWidth<=820){const d=$("#cdetail");d&&d.scrollIntoView({behavior:"smooth",block:"start"})}return}
  else if(t.dataset.ct!=null)ui.ct=t.dataset.ct;
  else if(t.dataset.go){location.hash=t.dataset.go;return}
  else if(t.dataset.kind){const k=t.dataset.kind;if(k!="watchlist"){ui.bk=k;ui.bf=null}save();return}
  else if(t.classList.contains("post")){if(e.target.closest("a"))return;t.classList.toggle("open");return}
  save();render();
});
document.addEventListener("input",e=>{
  if(["cEntry","cStop","cPct"].includes(e.target.id))calc();
  if((e.target.id=="rq"||e.target.id=="cq")&&(e.isComposing||e.inputType=="insertCompositionText"))return;   // 한글 조합 중 다시 그리면 글자가 ㅅㅏㅁ처럼 깨짐 (2026-11-12)
  if(e.target.id=="rq"){ui.rq=e.target.value;save();const pos=e.target.selectionStart;render();const el=$("#rq");el.focus();el.setSelectionRange(pos,pos);return}
  if(e.target.id=="cq"){ui.cq=e.target.value;save();const pos=e.target.selectionStart;render();const el=$("#cq");el.focus();el.setSelectionRange(pos,pos)}
});
document.addEventListener("compositionend",e=>{if(e.target.id=="rq"||e.target.id=="cq")e.target.dispatchEvent(new Event("input",{bubbles:true}))});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold){ui[d.dataset.fold]=d.open;save()}},true);
document.addEventListener("change",e=>{if(e.target.id=="chSel"){ui.ch=e.target.value;save();render()}if(e.target.id=="bSel"){ui.bf=e.target.value;save();render()}if(e.target.id=="cfSel"){ui.cf=e.target.value;save();render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-bnav]");if(!b||b.disabled)return;const o=$("#bSel");if(!o)return;const i=o.selectedIndex-parseInt(b.dataset.bnav);if(i>=0&&i<o.options.length){ui.bf=o.options[i].value;save();render()}});
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented)return;const h=a.getAttribute("href").slice(1);
  if(h&&h==location.hash.slice(1)){if(h=="stock"){ui.sc=null;ui.cc=null;ui.cq="";save()}render();window.scrollTo(0,0)}});
window.addEventListener("hashchange",()=>{if(!(route()=="strategy"&&ui.st=="companies")&&ui.cq){ui.cq="";save()}render();window.scrollTo(0,0)});   // 기업 검색어는 기업 탭을 떠나면 지움
if(!(route()=="strategy"&&ui.st=="companies"))ui.cq="";
render();
try{fetch("highs_live.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j){D.highsLive=j;render()}}).catch(()=>{})}catch(e){}
try{fetch("live.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j){applyLive(j);render()}}).catch(()=>{}).finally(()=>{pollQuotes(true);setInterval(pollQuotes,60000)})}catch(e){}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollQuotes()});
