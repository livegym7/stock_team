<title>JH트레이딩룸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: PC는 왼쪽 메뉴 + 본문, 휴대폰은 아래쪽 탭 5개 + 더보기. 시세판(트레이딩 단말) 느낌의 촘촘한 숫자 + 차분한 바탕 */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --line:#dde3ea; --fg:#18202b; --muted:#5f6b7a; --soft:#eef2f6;
  --accent:#0f766e; --accent-soft:#d6efec; --up:#d4342c; --down:#1f5fd1; --warn:#b45309; --warn-soft:#fdf0dc; --ok:#15803d;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --line:#26313d; --fg:#e4e9ef; --muted:#93a1b2; --soft:#1c2530;
  --accent:#2dd4bf; --accent-soft:#123a37; --up:#ff6b61; --down:#6aa2ff; --warn:#f0a43a; --warn-soft:#3a2a12; --ok:#4ade80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --line:#26313d; --fg:#e4e9ef; --muted:#93a1b2; --soft:#1c2530;
  --accent:#2dd4bf; --accent-soft:#123a37; --up:#ff6b61; --down:#6aa2ff; --warn:#f0a43a; --warn-soft:#3a2a12; --ok:#4ade80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} small{font-size:12px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--panel);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:16px;margin:0 8px 14px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em}
nav.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--soft)} nav.side a.on{background:var(--accent-soft);color:var(--accent)}
nav.side .ico{width:18px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
nav.side a.on .ico{color:var(--accent)}
.built{margin-top:auto;font-size:11px;color:var(--muted);padding:0 10px}
main{min-width:0;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.grid{display:grid;gap:12px} .grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.src{font-size:11px;color:var(--muted);margin-top:8px}
.opinion{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;padding:14px 16px;white-space:pre-wrap;font-size:14.5px;line-height:1.65}
.kpi span{display:block;font-size:11px;color:var(--muted);letter-spacing:.03em}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;margin:2px 0}
.gauge{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;background:var(--accent)}
.gauge.hot i{background:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.tile span{font-size:11px;color:var(--muted)} .trow{display:flex;justify-content:space-between;align-items:flex-end;gap:4px} .trow>div{min-width:0} .spk{flex:none;display:block} .tile b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.alert{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.tl{display:grid;gap:6px} .tl4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
h3{font-size:13.5px;margin:0 0 10px}
.regime{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
.regime.red{box-shadow:inset 3px 0 0 var(--down)} .regime.green{box-shadow:inset 3px 0 0 var(--ok)} .regime.yellow{box-shadow:inset 3px 0 0 var(--warn)}
.ins{display:grid;gap:8px}
.insrow{border-bottom:1px solid var(--line);padding-bottom:8px;cursor:pointer} .insrow:last-child{border-bottom:0;padding-bottom:0}
.ihead{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap} .ihead .pill{margin-left:auto}
.ifig{font-size:12.5px;margin:2px 0}
.pc{display:grid;gap:1px;font-size:12px} .pro{color:var(--ok)} .con{color:var(--warn)}
.tl a{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);background:var(--panel)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th.l,td.l{text-align:left} tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.rbar{width:90px;height:5px;background:var(--soft);border-radius:3px;margin-top:4px;position:relative}
.rbar i{position:absolute;top:0;bottom:0;left:0;background:var(--ok);border-radius:3px}
.sbar{width:70px;height:5px;background:var(--soft);border-radius:3px;margin-top:4px;margin-left:auto;overflow:hidden} .sbar i{display:block;height:100%;background:var(--accent)}
.rbar::after{content:"";position:absolute;left:25%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:6px}
.item{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.bsel{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;margin-bottom:10px}
.bsel select{max-width:420px}
.chip:disabled{opacity:.4;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ladder{display:grid;gap:4px;margin-top:8px}
.step{display:grid;grid-template-columns:86px 92px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:6px;background:var(--soft)}
.step.now{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.step.done{opacity:.55}
.step .lv{font-family:var(--mono);font-weight:600}
.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.brief{white-space:pre-wrap;font-size:14px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px}
.feed{display:grid;gap:8px}
.post{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;min-width:0}
.post .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.post.open .body{display:block}
input,select{width:100%;min-width:0;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{display:flex;height:12px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .track .u{background:var(--up)} .bar .track .d{background:var(--down)} .bar .track .n{background:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.tabbar{display:none}
.rbox{display:flex;gap:8px;align-items:center;font-size:11.5px;line-height:1.4} .rbox .chip{flex:none} .warnt{color:var(--warn)}
.mobile-only{display:none}
.cg{display:inline-flex} .cg .chip:first-child{border-radius:99px 0 0 99px} .cg .rb{border-radius:0 99px 99px 0;border-left:0;padding:4px 9px;color:var(--accent)}
.gloss summary{cursor:pointer;list-style:none} .gloss summary::before{content:"▸ ";color:var(--muted)} .gloss[open] summary::before{content:"▾ "}
td.wrap{white-space:normal;line-height:1.5} .gloss td{white-space:normal} .gloss td:first-child{white-space:nowrap}
.rulecard ol{margin:4px 0 10px;padding-left:20px;line-height:1.7} .rulecard p{margin:4px 0 10px;line-height:1.6} .rulecard{border-color:var(--accent)}
.bwhead{margin-bottom:8px;white-space:normal} .bwbody{white-space:pre-wrap;min-height:2em}
.more{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .mobile-only{display:block;margin-bottom:12px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{display:grid;place-items:center;gap:1px;padding:8px 2px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;font-family:inherit}
  .tabbar .ico{font-family:var(--mono);font-size:13px}
  .tabbar .on{color:var(--accent)}
  .more.open{display:grid;position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--panel);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));grid-template-columns:1fr 1fr;gap:6px}
  .more a{padding:10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg)}
  h1{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
.ctool{display:flex;gap:8px;margin-bottom:8px}.ctool input{flex:1 1 auto;min-width:0;width:auto}.ctool select{flex:0 0 auto;width:auto;max-width:42%}
#cdetail .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.csplit{grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}
.clist{display:grid;gap:4px;max-height:calc(100vh - 210px);overflow-y:auto;position:sticky;top:12px;padding-right:4px}
.crow{display:grid;grid-template-columns:20px minmax(0,1fr) 64px 58px 64px 54px;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.crow.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)} .crow:hover{border-color:var(--accent)}
.crank{color:var(--muted);font-size:11px}.cname{display:flex;flex-direction:column;min-width:0}.cname b,.cname small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{font-size:12.5px;text-align:right}.crep{font-size:11px;text-align:right;white-space:nowrap}
.rsb{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 5px;white-space:nowrap;text-align:center}.rsb.hi{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}.rsb.mid{background:var(--soft)}.rsb.lo{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
.rsb small{font-size:10px}
#cdetail h3{font-size:14px;margin:14px 0 6px}
@media(max-width:820px){.csplit{grid-template-columns:minmax(0,1fr)}.clist{max-height:42vh;position:static}.crow{grid-template-columns:18px minmax(0,1fr) 54px 52px 60px}.crep{display:none}}
.ngroup{display:flex;align-items:center;justify-content:space-between;margin:14px 8px 4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.ngroup:first-of-type{margin-top:4px}
.rfb{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font:inherit;font-size:12px;padding:1px 7px;cursor:pointer}.rfb:hover{color:var(--accent);border-color:var(--accent)}
.more .mg{grid-column:1/-1;margin:6px 2px 0}
.rfnote{margin:2px 8px 8px;padding:8px 10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;font-size:12px;line-height:1.5;color:var(--fg)}.rfnote small{color:var(--muted)}
.flow{display:grid;gap:6px;margin-bottom:12px}.flow .fi{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit}
.flow .fi.on{border-color:var(--accent)}.flow .fi>span:last-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.flow .fi{grid-template-columns:110px minmax(0,1fr)}.flow .fi small{color:var(--muted)}
.rchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font:inherit;font-size:12.5px;color:var(--fg);cursor:pointer}.rchip:hover{border-color:var(--accent)}
.idea p{margin:6px 0 8px;font-size:13.5px}.idea .mk{font-size:12.5px;margin-bottom:4px}.idea .con{font-size:12.5px;color:var(--down)}.idea .pro{color:var(--up);font-weight:600}
.linkb{border:0;background:none;color:var(--accent);font:inherit;font-size:11.5px;padding:0;cursor:pointer;text-decoration:underline}
.howto{line-height:1.8}
.split{align-items:start}.list{align-content:start}
article.idea h3{font-size:14px;margin:16px 0 6px}article.idea .opinion{white-space:normal}
</style>

<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="more" id="more"></div>
<nav class="tabbar" id="tabbar"></nav>

<script>
let D = /*__DATA__*/null;
/* 새로고침으로 받은 더 최신 데이터가 이 브라우저에 있으면 그걸 쓴다 */
try{const c=JSON.parse(localStorage.getItem("tr-data")||"null");if(c&&D&&c.built_at>D.built_at)D=c}catch(e){}
const MENU=[["home","오늘","◎"],["briefs","브리핑","≡"],["portfolio","포트폴리오","₩"],["companies","기업","□"],["research","딥리서치","◆"],["channels","채널","✉"],["sectors","섹터","▤"],["watch","감시 목록","◇"],["lab","검증실","△"],["config","규칙·일정","⚙"]];
const GROUPS=[["분석","analysis",["home","briefs","portfolio","companies","research","channels"]],["모니터링","monitoring",["sectors","watch","lab"]],["기타",null,["config"]]];
const TABS=["home","briefs","research","portfolio"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const w=n=>n==null||isNaN(n)?"-":Math.round(n).toLocaleString("ko-KR");
const pc=(n,d=1)=>n==null||isNaN(n)?"-":(n>0?"+":"")+Number(n).toFixed(d)+"%";
const cls=n=>n>0?"up":n<0?"down":"";
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ui=store.get("tr-ui",{});
function save(){store.set("tr-ui",ui)}
function src(t){return `<div class="src">${esc(t)}</div>`}

function nav(){
  const cur=route();
  $("#side").innerHTML=`<div class="brand">JH트레이딩룸<small>추세추종 돌파 · 보기 전용</small></div>`+
    GROUPS.map(([g,rf,ks])=>`<div class="ngroup"><span>${g}${rf?` <small class="num">${esc(partAt(rf).slice(11))}</small>`:""}</span>${rf?`<button class="rfb" data-rf="${rf}" title="${g} 새로고침" aria-label="${g} 새로고침">↻</button>`:""}</div>${rf?rfNote(rf):""}`+
      ks.map(k=>{const [,n,i]=MENU.find(m=>m[0]==k);return `<a href="#${k}" class="${cur==k?"on":""}"><span class="ico">${i}</span>${n}</a>`}).join("")).join("")+
    `<div class="built">${refreshBox()}<br>${esc(D.note)}</div>`;
  $("#tabbar").innerHTML=TABS.map(k=>{const m=MENU.find(x=>x[0]==k);return `<a href="#${k}" class="${cur==k?"on":""}"><span class="ico">${m[2]}</span>${m[1]}</a>`}).join("")+
    `<button id="moreBtn" class="${TABS.includes(cur)?"":"on"}"><span class="ico">⋯</span>더보기</button>`;
  $("#more").innerHTML=GROUPS.map(([g,rf,ks])=>`<div class="ngroup mg"><span>${g}${rf?` <small class="num">${esc(partAt(rf).slice(5))}</small>`:""}</span>${rf?`<button class="rfb" data-rf="${rf}" aria-label="${g} 새로고침">↻ 새로고침</button>`:""}</div>${rf?`<div class="mg">${rfNote(rf)}</div>`:""}`+
    ks.filter(k=>!TABS.includes(k)).map(k=>{const [,n,i]=MENU.find(m=>m[0]==k);return `<a href="#${k}">${i} ${n}</a>`}).join("")).join("");
  $("#moreBtn").onclick=()=>$("#more").classList.toggle("open");
}
function route(){const h=location.hash.slice(1);return MENU.some(m=>m[0]==h)?h:"home"}

/* ---------- 오늘 ---------- */
function latestOpinion(){return (D.briefs||[]).find(b=>b.opinion)}
function marketTiles(){
  const m=D.market||{}, K={KOSPI:"^KS11",KOSDAQ:"^KQ11"};
  const rows=[...(m.kr||[]).map(r=>({n:r.index,p:r.price,c:r.change_pct,s:K[r.code]})),...(m.us||[]).map(r=>({n:r.name,p:r.price,c:r.change_pct,s:r.symbol}))];
  if(!rows.length)return `<div class="empty">시세를 불러오지 못했습니다</div>`;

function spark(d){

  const x=i=>(i/(n-1)*W).toFixed(1), y=v=>(H-2-(v-lo)/rg*(H-4)).toFixed(1);
  const path=(a,b)=>c.slice(a,b).map((v,i)=>(i?"L":"M")+x(a+i)+" "+y(v)).join("");
  const sp=Math.max(1,d.split), last=c[n-1], col=last>base?"var(--up)":last<base?"var(--down)":"var(--muted)";
  const today=path(sp-1,n), area=today+`L${x(n-1)} ${y(base)}L${x(sp-1)} ${y(base)}Z`;
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
   ${d.split>1?`<rect x="0" y="0" width="${x(sp-1)}" height="${H}" fill="var(--soft)"/>`:""}
   <line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-width=".6" stroke-dasharray="2 2"/>
   ${d.split>1?`<path d="${path(0,sp)}" fill="none" stroke="var(--muted)" stroke-width="1"/>`:""}
   <path d="${area}" fill="${col}" fill-opacity=".12" stroke="none"/>
   <path d="${today}" fill="none" stroke="${col}" stroke-width="1.3"/>
   <circle cx="${x(n-1)}" cy="${y(last)}" r="1.6" fill="${col}"/></svg>`;
}

async function writeBrief(kind){
  if(BW.state=="writing"||BW.state=="data")return;
  if(kind=="all"){doRefresh();return}
  if(kind=="report")kind=+nowKst().slice(11,13)<13?"report_brief_am":"report_brief_pm";
  const sample=await claude.use("sample").catch(()=>null);
  if(!sample){BW.state="error";BW.name=KNAME[kind];BW.msg="이 화면에서는 즉석 쓰기를 쓸 수 없습니다 (claude.ai에서 열어 주세요)";render();return}
  Object.assign(BW,{state:"data",kind,name:KNAME[kind],text:"",msg:""});ui.bk=kind;save();render();
  const age=(Date.parse(nowKst().replace(" ","T")+":00Z")-Date.parse(D.built_at.replace(" ","T")+":00Z"))/60000;
  let stale="";
  if(age>20){
    stale=`${D.built_at} 데이터로 씁니다. 더 새 데이터로 쓰려면 Claude에게 "새로고침해줘"라고 말한 뒤 다시 눌러 주세요`;}
  BW.state="writing";BW.msg=stale;render();
  const at=nowKst();
  try{
    const res=await sample(promptFor(kind),{modelTier:"default",cache:false,onText:({text})=>{BW.text=text;const el=document.querySelector(".bwbody");if(el)el.textContent=text;else if(route()=="briefs")render()}});
    const text=res.text||BW.text;
    const b={date:at.slice(0,10),time:at.slice(11,16),kind,kind_name:KNAME[kind],file:"web:"+kind+":"+at,title:text.split("\n")[0],text,web:true,data_at:D.built_at,
      opinion:(()=>{const L=text.split("\n"),i=L.findIndex(x=>x.trim().startsWith("💡"));if(i<0)return null;const o=[];for(const x of L.slice(i)){if(o.length>1&&!x.trim())break;if(x.trim())o.push(x)}return o.slice(0,8).join("\n")})()};
    saveExtra(b);mergeExtra();ui.bf=b.file;save();
    Object.assign(BW,{state:"idle",text:"",msg:""});render();
  }catch(e){
    const c=e&&e.code;
    BW.state="error";BW.msg=c=="not_granted"?"Claude 사용을 허용하지 않아 쓸 수 없습니다. 다시 열어 허용해 주세요":c=="rate_limited"?"사용 한도에 걸렸습니다. 잠시 뒤 다시 눌러 주세요":"쓰다가 멈췄습니다. 잠시 뒤 다시 눌러 주세요";render();
  }
}

function levels(p){
  const a=D.account||{}, unit=p.avg_price-p.initial_stop, be=a.breakeven_at_r||3, take=a.take_profit_at_3r;
  const L=[
   {r:-1,price:p.stop<p.avg_price?p.stop:p.initial_stop,label:"손절",act:`전량 손절 · 손실 ${w(-(p.avg_price-p.stop)*p.qty)}원 (${((p.stop/p.avg_price-1)*100).toFixed(1)}%)`,kind:"stop"},
   {r:0,price:p.avg_price,label:"본전",act:"평균 매수가",kind:"be"},
   {r:1,price:p.avg_price+unit,label:"1R",act:`평가이익 ${w(unit*p.qty)}원 · 아직 손절가 그대로`,kind:"info"},
   {r:2,price:p.avg_price+2*unit,label:"2R",act:`평가이익 ${w(2*unit*p.qty)}원`,kind:"info"},
   {r:be,price:p.avg_price+be*unit,label:be+"R",act:(take?`${Math.round(take*100)}% 익절 ${p.take_qty_at_3r}주(약 +${w(p.take_won_at_3r)}원 실현) + `:"")+`남은 물량 손절가를 본전 ${w(p.avg_price)}원으로 → CR ${w(p.cr_won)} → 0`,kind:"key"}];
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price&&m)L.push({r:-0.5,price:m,label:(p.trail_ma||20)+"일선",act:`종가로 하향 돌파하면 나머지 ${p.qty}주 전략 매도`,kind:"stop"});
  return L.filter((x,i)=>!(x.r==2&&be==2));
}
function nextStep(p){
  if(p.price==null)return "-";
  const m=p["ma"+(p.trail_ma||20)];
  if(p.stop>=p.avg_price)return m?`3R 이후 · ${p.trail_ma||20}일선 ${w(m)}원(${pc((m/p.price-1)*100)}) 종가 이탈 시 나머지 매도 · 손절가 본전 ${w(p.stop)}`:"3R 이후 · 20일선 종가 이탈 시 나머지 매도";

function codeOf(name){const R=D.research||{};for(const d of R.docs||[])for(const s of d.stocks||[])if(s.name==name&&s.code)return s.code;const c=(D.companies||[]).find(c=>c.name==name);return c?c.code:null}

  <div class="chips"><button class="chip ${tab=="syn"?"on":""}" data-rt="syn">🧭 종합</button><button class="chip ${tab=="docs"?"on":""}" data-rt="docs">📄 문서 ${docs.length}</button><button class="chip ${tab=="score"?"on":""}" data-rt="score">📈 성적표</button><button class="chip ${tab=="rev"?"on":""}" data-rt="rev">🔺 목표가 흐름</button><button class="chip ${tab=="how"?"on":""}" data-rt="how">➕ 추가하는 법</button></div>`;

  ${src("종합은 Claude 해석입니다. 리포트 숫자는 각 문서의 출처(증권사·날짜)를 따르고, 시장 확인 숫자는 웹 데이터 "+(D.built_at||"")+" 기준")}`;

function retC(v){return v==null?`<span class="muted">-</span>`:`<span class="num ${cls(v)}">${pc(v)}</span>`}

  ${I.map(i=>`<tr><td class="l" style="white-space:normal;min-width:180px"><b>${esc(i.title)}</b>${i.active?"":` <span class="pill">종합에서 빠짐</span>`}</td><td class="num">${esc(i.first_seen.slice(5))}</td><td>${esc(i.confidence||"-")}${i.confidence_now&&i.confidence_now!=i.confidence?` → ${esc(i.confidence_now)}`:""}</td>
   <td>${retC(i.avg_ret)}</td><td>${retC(i.bench_ret)}</td><td><b>${retC(i.excess)}</b></td>
   <td class="l" style="white-space:normal">${i.stocks.map(x=>`<span style="display:inline-block;margin:0 10px 2px 0">${esc(x.name)} ${retC(x.ret)}${x.w1!=null?` <small class="muted">1주 ${pc(x.w1)}</small>`:""}${x.m1!=null?` <small class="muted">1개월 ${pc(x.m1)}</small>`:""}</span>`).join("")}</td></tr>`).join("")}</table></div>`:`<div class="empty">아직 기록된 아이디어가 없습니다</div>`}
  <div class="grid g2" style="margin-top:16px">
   <div class="panel"><h3>🏦 증권사별 (리포트 Top pick·수혜 종목)</h3>${B.length?`<table><tr><th class="l">증권사</th><th>종목 수</th><th>평균</th><th>오른 종목</th><th>시장 대비</th></tr>${B.map(b=>`<tr><td class="l">${esc(b.broker)}</td><td class="num">${b.n}</td><td>${retC(b.avg)}</td><td class="num">${b.win}/${b.n}</td><td><b>${retC(b.excess)}</b></td></tr>`).join("")}</table>`:`<div class="empty">-</div>`}

function revFlow(){
  const C=(D.companies||[]).filter(c=>c.rev&&c.n_reports>=2).map(c=>({...c,score:c.rev.net*10+(c.rev.avg_chg||0)}));
  const up=[...C].filter(c=>c.rev.net>0).sort((a,b)=>b.score-a.score).slice(0,15), down=[...C].filter(c=>c.rev.net<0).sort((a,b)=>a.score-b.score).slice(0,10);

  return `<div class="sub" style="margin-top:-6px">최근 31일 채널 리포트의 <b>목표주가 변경</b>으로 본 추정치 흐름입니다. 영업이익 추정 변화는 원문이 있는 딥리서치 문서에서 봅니다. 목표가가 몰려 오르는데 강도(RS)도 높은 종목이 깡토 관점에서 함께 볼 만한 곳입니다 · 출처: 채널 리포트 요약(2차 자료)</div>

  <article class="panel idea">${docDetail(sel)}</article></div>`:`<div class="empty">해당 문서 없음</div>`}`;

function docDetail(d){

function statRow(name,x){
  if(!x||!x.n)return `<tr><td class="l">${esc(name)}</td><td class="num">0</td><td colspan="6" class="l muted">신호 없음</td></tr>`;
  return `<tr><td class="l">${esc(name)}</td><td class="num">${x.n}</td><td class="num">${x.win_rate}%</td><td class="num ${cls(x.avg_r)}"><b>${x.avg_r>0?"+":""}${x.avg_r}R</b></td><td class="num">${x.avg_win>0?"+":""}${x.avg_win} / ${x.avg_loss}</td><td class="num">${x.profit_factor??"-"}</td><td class="num">${x.reach_3r_pct}%</td><td class="num">${x.avg_days}일</td></tr>`;
}
function curveSvg(c){
  if(!c||c.length<2)return "";
  const W=640,H=150,P=28,ys=c.map(p=>p[1]),lo=Math.min(0,...ys),hi=Math.max(0,...ys),rg=(hi-lo)||1;
  const x=i=>P+(i/(c.length-1))*(W-P-6), y=v=>6+(hi-v)/rg*(H-26);
  const d=c.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  const tick=[hi,0,lo].filter((v,i,a)=>a.indexOf(v)==i);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="누적 R 곡선">
   ${tick.map(v=>`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v==0?'stroke-dasharray="3 3"':""}/><text x="${P-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(v)}R</text>`).join("")}
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
   <circle cx="${x(c.length-1)}" cy="${y(ys[ys.length-1])}" r="3" fill="var(--accent)"/>
   <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${esc(c[0][0])}</text><text x="${W-6}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(c[c.length-1][0])}</text></svg></div>`;
}

const RF={state:"idle",msg:"",started:null};
const GH="GitHub";
function refreshBox(){

function parseFile(res){
  const blocks=(res&&res.content)||[];
  for(const b of blocks){const t=(b.resource&&b.resource.text)||b.text||"";const i=t.indexOf("{");if(i>=0){try{return JSON.parse(t.slice(i))}catch(e){}}}
  if(res&&res.payload&&typeof res.payload=="object"&&res.payload.built_at)return res.payload;
  return null;
}
function ghMsg(e){
  const c=e&&e.code;
  if(c=="server_not_connected")return "깃허브 연결이 없습니다. claude.ai 설정 → 커넥터에서 GitHub를 추가해 주세요";
  if(c=="needs_reauth")return "깃허브 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 GitHub를 다시 연결해 주세요";
  if(c=="not_in_manifest"||c=="approval_required")return "이 페이지에 깃허브 사용이 허용되지 않았습니다. 다시 누르고 '허용'을 선택해 주세요";
  if(c=="selection_required")return "깃허브 연결이 여러 개입니다. 위쪽 안내에서 하나를 골라 주세요";
  if(c=="tool_error")return "깃허브가 요청을 거절했습니다: "+String(e.message||"").slice(0,120);
  if(c=="not_granted"||c=="capability_disabled"||c=="capability_removed")return "이 화면에서는 깃허브 연결을 쓸 수 없습니다 (claude.ai 웹이나 앱에서 열어 주세요) ["+c+"]";
  if(c=="blocked_by_policy")return "조직 정책이 이 깃허브 기능을 막고 있습니다 ["+c+"]";
  if(c=="server_not_found")return "깃허브 연결을 찾을 수 없습니다. 설정 → 커넥터에서 GitHub를 다시 연결해 주세요 ["+c+"]";
  if(c=="server_unavailable")return "깃허브 서버가 응답하지 않습니다. 몇 분 뒤 다시 눌러 주세요 ["+c+"]";
  return "연결 오류 ["+(c||"알 수 없음")+"] "+String((e&&e.message)||"").slice(0,100)+" — 이 문구를 Claude에게 알려 주세요";
}
const REFRESH_HELP="Claude 대화에서 \"분석 새로고침\" / \"모니터링 새로고침\" / \"채널만 새로고침\"이라고 말해 주세요";
// 깃허브 연결 방식(doRefreshCb)은 사용자 계정에 GitHub 커넥터가 없어 쓰지 않음 (2026-11-04). 버튼은 안내만 한다.
let RFP=null;
const RFTXT={analysis:["분석 새로고침","시세·계좌·브리핑 목록·기업·채널 (약 1~2분)"],monitoring:["모니터링 새로고침","감시 목록 다시 계산 + 섹터·검증실 (약 5~10분)"]};

function refreshPart(part){RFP=RFP===part?null:part;nav();const m=$("#more");if(m&&m.classList.contains("open"))m.classList.add("open")}
function rfNote(part){if(RFP!==part)return "";const [cmd,what]=RFTXT[part];
  return `<div class="rfnote">Claude 대화에서 <b>"${cmd}"</b>이라고 말해 주세요 · ${what}<br><small>마지막 갱신 ${esc(partAt(part))} · 자동: ${part=="analysis"?"평일 07:32·09:12·10:32·15:32·16:32":"평일 16:07 감시 목록 → 16:32 반영"}</small></div>`}
function doRefresh(){RF.state="idle";RF.msg=REFRESH_HELP;paintRefresh();return Promise.resolve(false)}
async function doRefreshCb(done){
  if(RF.state=="running"){done(false);return}
  const mcp=await claude.use("mcp").catch(()=>null);
  if(!mcp){RF.state="error";RF.msg="이 화면에서는 새로고침을 쓸 수 없습니다 (claude.ai에서 열어 주세요)";paintRefresh();done(false);return}
  const cfg=D.refresh||{owner:"livegym7",repo:"stock_team",workflow:"web-data.yml",branch:"web-data",path:"data.json"};
  RF.state="running";RF.started=Date.now();RF.msg="깃허브에 요청 보내는 중…";paintRefresh();
  const asked=new Date(Date.now()+9*3600e3-60e3).toISOString().slice(0,16).replace("T"," ");
  const run=()=>mcp.callTool(GH,"actions_run_trigger",{method:"run_workflow",owner:cfg.owner,repo:cfg.repo,workflow_id:cfg.workflow,ref:"main"},{cache:false});
  try{await run()}
  catch(e){
    // 허용 창이 막 떠서 결정을 못 받은 경우(upstream_error + retryable)는 요청이 깃허브에 닿지 않았으므로 한 번만 다시 시도
    if(e&&e.retryable&&e.code=="upstream_error"){RF.msg="깃허브 허용 확인 중… 잠시 뒤 한 번 더 시도";paintRefresh();
      await new Promise(r=>setTimeout(r,Math.min(e.retryAfterMs||3000,15000)+Math.random()*1000));
      try{await run()}catch(e2){RF.state="error";RF.msg=ghMsg(e2);paintRefresh();done(false);return}}
    else{RF.state="error";RF.msg=ghMsg(e);paintRefresh();done(false);return}}
  let n=0;
  const tick=async()=>{
    n++;const min=Math.floor((Date.now()-RF.started)/60000);
    RF.msg=`최신 데이터 만드는 중 (${min}분 지남, 보통 3~6분)`;paintRefresh();
    try{
      const res=await mcp.callTool(GH,"get_file_contents",{owner:cfg.owner,repo:cfg.repo,path:cfg.path,ref:"refs/heads/"+cfg.branch},{cache:false});
      const nd=parseFile(res);
      if(nd&&nd.built_at&&nd.built_at>=asked){
        D=nd;try{localStorage.setItem("tr-data",JSON.stringify(nd))}catch(e){}
        mergeExtra();RF.state="done";RF.msg="방금 새로고침됨";render();done(true);return;
      }
    }catch(e){if(!e||!e.retryable&&e.code!="tool_error"){RF.state="error";RF.msg=ghMsg(e);paintRefresh();done(false);return}}
    if(n>=26){RF.state="error";RF.msg="시간이 오래 걸립니다. 깃허브 Actions(웹 데이터 새로고침) 실행 기록을 확인해 주세요";paintRefresh();done(false);return}
    setTimeout(tick,30000);
  };
  setTimeout(tick,60000);
}

  else if(t.dataset.bf!=null)ui.bf=t.dataset.bf;
  else if(t.dataset.wg!=null){ui.wg=t.dataset.wg;ui.ws=""}
  else if(t.dataset.ws!=null)ui.ws=t.dataset.ws;
  else if(t.dataset.wd!=null)ui.wd=ui.wd==t.dataset.wd?null:t.dataset.wd;
  else if(t.dataset.cc!=null){ui.cc=t.dataset.cc;save();render();if(innerWidth<=820){const d=$("#cdetail");d&&d.scrollIntoView({behavior:"smooth",block:"start"})}return}
  else if(t.dataset.ct!=null)ui.ct=t.dataset.ct;
  else if(t.dataset.go){location.hash=t.dataset.go;return}
  else if(t.dataset.kind){const k=t.dataset.kind;if(k!="watchlist"){ui.bk=k;ui.bf=null}save();return}
  else if(t.classList.contains("post")){if(e.target.closest("a"))return;t.classList.toggle("open");return}
  save();render();
});
document.addEventListener("input",e=>{
  if(["cEntry","cStop","cPct"].includes(e.target.id))calc();
  if(e.target.id=="cq"){ui.cq=e.target.value;save();const pos=e.target.selectionStart;render();const el=$("#cq");el.focus();el.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{if(e.target.id=="chSel"){ui.ch=e.target.value;save();render()}if(e.target.id=="bSel"){ui.bf=e.target.value;save();render()}if(e.target.id=="cfSel"){ui.cf=e.target.value;save();render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-bnav]");if(!b||b.disabled)return;const o=$("#bSel");if(!o)return;const i=o.selectedIndex-parseInt(b.dataset.bnav);if(i>=0&&i<o.options.length){ui.bf=o.options[i].value;save();render()}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
if(D)mergeExtra();
render();
</script>
